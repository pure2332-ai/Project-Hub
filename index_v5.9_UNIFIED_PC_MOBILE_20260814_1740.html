function ProjectFormModal({ project, onClose, onSave, lang = 'th' }) {
      const t = (key) => translations[lang]?.[key] || translations['th']?.[key] || key;
      const DRAFT_KEY = 'project_hub_form_draft_v1';

      // Load initial state (Check draft if creating new project)
      const [title, setTitle] = useState(project?.title || '');
      const [code, setCode] = useState(project?.code || '');
      const [owner, setOwner] = useState(project?.owner || '');
      const [seller, setSeller] = useState(project?.seller || '');
      const [contractor, setContractor] = useState(project?.contractor || '');
      const [client, setClient] = useState(project?.client || '');
      const [budget, setBudget] = useState(project?.budget || '');
      const [costPlan, setCostPlan] = useState(project?.costPlan || '');
      const [location, setLocation] = useState(project?.location || '');
      const [zipcode, setZipcode] = useState(project?.zipcode || '');
      const [selectedProvince, setSelectedProvince] = useState(project?.province || '');
      const [selectedAmphoe, setSelectedAmphoe] = useState(project?.amphoe || '');
      const [selectedTambon, setSelectedTambon] = useState(project?.tambon || '');
      const [addressDetail, setAddressDetail] = useState(project?.addressDetail || '');

      // Available Districts based on selected Province
      const availableAmphoes = React.useMemo(() => {
        const provObj = THAI_ADDRESS_DATA.find(p => p.name === selectedProvince);
        return provObj ? provObj.amphoes : [];
      }, [selectedProvince]);

      // Available Sub-districts based on selected District
      const availableTambons = React.useMemo(() => {
        const amphoeObj = availableAmphoes.find(a => a.name === selectedAmphoe);
        return amphoeObj ? amphoeObj.tambons : [];
      }, [availableAmphoes, selectedAmphoe]);

      // Handle Typing Zipcode (5 digits guaranteed auto-lookup)
      const handleZipcodeChange = (val) => {
        setZipcode(val);
        if (val.length === 5) {
          // 1. First search for exact match on 5-digit zipcode in THAI_ADDRESS_DATA
          for (const prov of THAI_ADDRESS_DATA) {
            for (const amph of prov.amphoes) {
              for (const tam of amph.tambons) {
                if (tam.zip === val) {
                  setSelectedProvince(prov.name);
                  setSelectedAmphoe(amph.name);
                  setSelectedTambon(tam.name);
                  return;
                }
              }
            }
          }
          // 2. Fallback to 2-digit zipcode prefix map for 100% instant auto-province & district fill
          const prefix = val.substring(0, 2);
          const matchedProv = ZIPCODE_PROVINCE_MAP[prefix];
          if (matchedProv) {
            setSelectedProvince(matchedProv);
            const provObj = THAI_ADDRESS_DATA.find(p => p.name === matchedProv);
            if (provObj && provObj.amphoes.length > 0) {
              const firstAmph = provObj.amphoes[0];
              setSelectedAmphoe(firstAmph.name);
              if (firstAmph.tambons.length > 0) {
                setSelectedTambon(firstAmph.tambons[0].name);
              }
            }
          }
        }
      };

      // Handle Province Selection
      const handleProvinceChange = (provName) => {
        setSelectedProvince(provName);
        setSelectedAmphoe('');
        setSelectedTambon('');
      };

      // Handle District Selection
      const handleAmphoeChange = (amphName) => {
        setSelectedAmphoe(amphName);
        setSelectedTambon('');
      };

      // Handle Sub-district Selection (Auto-fill zip)
      const handleTambonChange = (tamName) => {
        setSelectedTambon(tamName);
        const tamObj = availableTambons.find(t => t.name === tamName);
        if (tamObj && tamObj.zip) setZipcode(tamObj.zip);
      };

      // Synthesize full location string whenever address fields change
      useEffect(() => {
        const parts = [
          addressDetail.trim(),
          selectedTambon ? 'ต.' + selectedTambon : '',
          selectedAmphoe ? 'อ.' + selectedAmphoe : '',
          selectedProvince ? 'จ.' + selectedProvince : '',
          zipcode.trim()
        ].filter(Boolean);

        if (parts.length > 0) {
          setLocation(parts.join(' '));
        }
      }, [addressDetail, selectedTambon, selectedAmphoe, selectedProvince, zipcode]);
      const [googleMap, setGoogleMap] = useState(project?.googleMap || '');
      const [status, setStatus] = useState(project?.status || 'in-progress');
      const [startDate, setStartDate] = useState(project?.startDate || '');
      const [targetDate, setTargetDate] = useState(project?.targetDate || '');
      const [description, setDescription] = useState(project?.description || '');
      const [progress, setProgress] = useState(project?.progress || 0);

      // Warranty Fields
      const [hasWarranty, setHasWarranty] = useState(project?.hasWarranty || 'yes');
      const [warrantyYears, setWarrantyYears] = useState(project?.warrantyYears || 1);
      const [warrantyStartDate, setWarrantyStartDate] = useState(project?.warrantyStartDate || '');

      // Attached Documents State
      const [documents, setDocuments] = useState(project?.documents || []);

      // Draft & Dirty state
      const [isFormTouched, setIsFormTouched] = useState(false);
      const [hasDraft, setHasDraft] = useState(() => !project && !!localStorage.getItem(DRAFT_KEY));

      // Auto-save draft for NEW project creation
      useEffect(() => {
        if (!project && isFormTouched) {
          const draftData = {
            title, code, owner, seller, contractor, client, budget, costPlan,
            location, googleMap, status, startDate, targetDate, description,
            progress, hasWarranty, warrantyYears, warrantyStartDate
          };
          localStorage.setItem(DRAFT_KEY, JSON.stringify(draftData));
        }
      }, [title, code, owner, seller, contractor, client, budget, costPlan, location, googleMap, status, startDate, targetDate, description, progress, hasWarranty, warrantyYears, warrantyStartDate, isFormTouched, project]);

      // Restore Draft
      const handleRestoreDraft = () => {
        try {
          const savedDraft = JSON.parse(localStorage.getItem(DRAFT_KEY));
          if (savedDraft) {
            setTitle(savedDraft.title || '');
            setCode(savedDraft.code || '');
            setOwner(savedDraft.owner || '');
            setSeller(savedDraft.seller || '');
            setContractor(savedDraft.contractor || '');
            setClient(savedDraft.client || '');
            setBudget(savedDraft.budget || '');
            setCostPlan(savedDraft.costPlan || '');
            setLocation(savedDraft.location || '');
            setGoogleMap(savedDraft.googleMap || '');
            setStatus(savedDraft.status || 'in-progress');
            setStartDate(savedDraft.startDate || '');
            setTargetDate(savedDraft.targetDate || '');
            setDescription(savedDraft.description || '');
            setProgress(savedDraft.progress || 0);
            setHasWarranty(savedDraft.hasWarranty || 'yes');
            setWarrantyYears(savedDraft.warrantyYears || 1);
            setWarrantyStartDate(savedDraft.warrantyStartDate || '');
            setHasDraft(false);
          }
        } catch (e) {}
      };

      const handleClearDraft = () => {
        localStorage.removeItem(DRAFT_KEY);
        setHasDraft(false);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        setIsFormTouched(true);

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const newDoc = {
              id: 'doc-' + Date.now() + Math.random().toString(36).substr(2, 4),
              name: file.name,
              size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
              date: new Date().toISOString().slice(0, 10),
              dataUrl: event.target.result
            };
            setDocuments(prev => [...prev, newDoc]);
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveDocument = (docId) => {
        if (confirm(t('confirmDeleteDoc'))) {
          setIsFormTouched(true);
          setDocuments(documents.filter(d => d.id !== docId));
        }
      };

      // SAFE CLOSE WITH CONFIRMATION PROMPT
      const handleSafeClose = () => {
        const hasContent = title || code || owner || seller || contractor || client || budget || costPlan || description || documents.length > 0;
        if (isFormTouched || hasContent) {
          const confirmExit = confirm(lang === 'en' ? '⚠️ You have unsaved changes in the form.\n\nAre you sure you want to close?' : '⚠️ คุณมีข้อมูลที่กรอกค้างไว้ในฟอร์ม\n\nหากปิดหน้าต่างนี้ ข้อมูลที่กำลังกรอกอยู่จะสูญหาย ยืนยันที่จะปิดหน้าต่างนี้หรือไม่?');
          if (!confirmExit) return;
        }
        if (!project) localStorage.removeItem(DRAFT_KEY);
        onClose();
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        onSave({
          ...project,
          id: project ? project.id : 'proj-' + Date.now(),
          title: title.trim(),
          code: code.trim(),
          owner: owner.trim(),
          seller: seller.trim(),
          contractor: contractor.trim(),
          client: client.trim(),
          budget: budget.trim(),
          costPlan: costPlan.trim(),
          location: location.trim(),
          province: selectedProvince || '',
          zipcode: zipcode.trim(),
          amphoe: selectedAmphoe || '',
          tambon: selectedTambon || '',
          addressDetail: addressDetail.trim(),
          googleMap: googleMap.trim(),
          status,
          startDate,
          targetDate,
          description: description.trim(),
          progress: Number(progress),
          hasWarranty,
          warrantyYears: Number(warrantyYears),
          warrantyStartDate,
          documents,
          tasks: project?.tasks || [],
          logs: project?.logs || [],
          expenses: project?.expenses || [],
          actualCost: project?.actualCost || '0',
          images: project?.images || []
        });

        if (!project) localStorage.removeItem(DRAFT_KEY);
      };

      return (
        <div className="modal-overlay">
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">{project ? t('formTitleEdit') : t('formTitleCreate')}</div>
                <div className="modal-subtitle">{lang === 'en' ? 'Fill project details, contract, attachments and warranty' : 'กรอกรายละเอียดข้อมูลโปรเจกต์ สัญญา เอกสารแนบ และการรับประกัน'}</div>
              </div>
              <button type="button" className="btn-icon" onClick={handleSafeClose} title={t('btnCancel')}>
                <Icon name="x" size={20} />
              </button>
            </div>

            {hasDraft && (
              <div style={{background:'var(--primary-light)', padding:'10px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid var(--border-color)', fontSize:'0.85rem'}}>
                <span>{lang === 'en' ? '💡 Found saved draft from earlier. Do you want to restore it?' : '💡 พบข้อมูลร่างที่คุณเคยกรอกค้างไว้ล่าสุด ต้องการกู้คืนหรือไม่?'}</span>
                <div style={{display:'flex', gap:8}}>
                  <button type="button" className="btn btn-primary" style={{padding:'4px 10px', fontSize:'0.75rem'}} onClick={handleRestoreDraft}>{lang === 'en' ? 'Restore Draft' : 'กู้คืนข้อมูลร่าง'}</button>
                  <button type="button" className="btn btn-secondary" style={{padding:'4px 10px', fontSize:'0.75rem'}} onClick={handleClearDraft}>{lang === 'en' ? 'Discard' : 'ล้างออก'}</button>
                </div>
              </div>
            )}

            <form onSubmit={handleSubmit} className="modal-body" onChange={() => setIsFormTouched(true)}>
              {/* Row 1: Project Name, Code, Owner */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formProjectTitle')} *</label>
                  <input type="text" className="form-input" placeholder={t('formProjectTitle')} value={title} onChange={e=>setTitle(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formProjectCode')}</label>
                  <input type="text" className="form-input" placeholder={t('formProjectCode')} value={code} onChange={e=>setCode(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formOwner')}</label>
                  <input type="text" className="form-input" placeholder={t('formOwner')} value={owner} onChange={e=>setOwner(e.target.value)} />
                </div>
              </div>

              {/* Row 2: Seller, Contractor, Client */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formSeller')}</label>
                  <input type="text" className="form-input" placeholder={t('formSeller')} value={seller} onChange={e=>setSeller(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formContractor')}</label>
                  <input type="text" className="form-input" placeholder={t('formContractor')} value={contractor} onChange={e=>setContractor(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formClient')}</label>
                  <input type="text" className="form-input" placeholder={t('formClient')} value={client} onChange={e=>setClient(e.target.value)} />
                </div>
              </div>

                            {/* Row 3: Budget, Planned Cost */}
              <div className="form-grid-2">
                <div className="form-group">
                  <label className="form-label">{t('formBudget')}</label>
                  <input type="text" className="form-input" placeholder={t('formBudget')} value={budget} onChange={e=>setBudget(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formCostPlan')}</label>
                  <input type="text" className="form-input" placeholder={t('formCostPlan')} value={costPlan} onChange={e=>setCostPlan(e.target.value)} />
                </div>
              </div>

              {/* FULL-WIDTH CASCADING THAI ADDRESS SECTION (BILINGUAL I18N SUPPORT) */}
              <div style={{marginTop:16, marginBottom:16, padding:16, background:'var(--bg-input)', borderRadius:12, border:'1px solid var(--border-color)', width:'100%'}}>
                <div style={{fontSize:'0.85rem', fontWeight:800, color:'var(--accent-cyan)', marginBottom:12, display:'flex', alignItems:'center', gap:6}}>
                  <Icon name="mapPin" size={16} />
                  <span>{lang === 'en' ? 'Project Location & Geographic Address' : 'สถานที่ตั้งและที่อยู่โครงการ (Cascading Address)'}</span>
                </div>

                {/* Top Row: 4 Columns (Zipcode, Province, District, Sub-district) */}
                <div className="form-grid-4" style={{marginBottom:12}}>
                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'Postal Code' : 'รหัสไปรษณีย์'}</label>
                    <input 
                      type="text" 
                      className="form-input" 
                      placeholder="10110, 50000" 
                      maxLength={5} 
                      value={zipcode} 
                      onChange={e => handleZipcodeChange(e.target.value)} 
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'Province' : 'จังหวัด'}</label>
                    <select className="form-select" value={selectedProvince} onChange={e => handleProvinceChange(e.target.value)}>
                      <option value="">{lang === 'en' ? '-- Select Province --' : '-- เลือกจังหวัด --'}</option>
                      {THAI_ADDRESS_DATA.map(p => (
                        <option key={p.name} value={p.name}>
                          {lang === 'en' ? (p.nameEn || p.name) : p.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'District / Amphoe' : 'อำเภอ/เขต'}</label>
                    <select className="form-select" value={selectedAmphoe} onChange={e => handleAmphoeChange(e.target.value)} disabled={!selectedProvince}>
                      <option value="">{lang === 'en' ? '-- Select District --' : '-- เลือกอำเภอ/เขต --'}</option>
                      {availableAmphoes.map(a => (
                        <option key={a.name} value={a.name}>
                          {lang === 'en' ? (a.nameEn || a.name) : a.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'Sub-District / Tambon' : 'ตำบล/แขวง'}</label>
                    <select className="form-select" value={selectedTambon} onChange={e => handleTambonChange(e.target.value)} disabled={!selectedAmphoe}>
                      <option value="">{lang === 'en' ? '-- Select Sub-District --' : '-- เลือกตำบล/แขวง --'}</option>
                      {availableTambons.map(t => (
                        <option key={t.name} value={t.name}>
                          {lang === 'en' ? (t.nameEn || t.name) : t.name} ({t.zip})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Bottom Row: Full Width Address Detail */}
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label">{lang === 'en' ? 'Address Detail / Substation Site (Manual Line)' : 'รายละเอียดที่อยู่/ถนน/พื้นที่โครงการ (กรอกมือ)'}</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder={lang === 'en' ? 'e.g. 123 Sukhumvit Rd, Substation Site A' : 'เช่น 123 ถ.สุขุมวิท, พื้นที่สถานีไฟฟ้าแรงสูง A'} 
                    value={addressDetail} 
                    onChange={e => setAddressDetail(e.target.value)} 
                  />
                </div>
              </div>{/* Row 4: Google Map, Project status, Start date */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formGoogleMap')}</label>
                  <input type="url" className="form-input" placeholder={t('formGoogleMap')} value={googleMap} onChange={e=>setGoogleMap(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formStatus')}</label>
                  <select className="form-select" value={status} onChange={e=>setStatus(e.target.value)}>
                    <option value="draft">📝 Draft ({lang === 'en' ? 'Draft' : 'ร่าง'})</option>
                    <option value="planning">📋 {t('statusPlanning')}</option>
                    <option value="in-progress">⚡ {t('statusInProgress')}</option>
                    <option value="completed">✅ {t('statusCompleted')}</option>
                    <option value="on-hold">⏸️ {t('statusOnHold')}</option>
                    <option value="cancel">🚫 Cancel ({lang === 'en' ? 'Cancel' : 'ยกเลิก'})</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formStartDate')}</label>
                  <input type="date" className="form-input" value={startDate} onChange={e=>setStartDate(e.target.value)} />
                </div>
              </div>

              {/* Row 5: End date */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formTargetDate')}</label>
                  <input type="date" className="form-input" value={targetDate} onChange={e=>setTargetDate(e.target.value)} />
                </div>
              </div>

              {/* Row 5: Progress % */}
              <div className="form-group" style={{marginBottom:16}}>
                <label className="form-label">{t('formProgress')} ({progress}%)</label>
                <input type="range" min="0" max="100" value={progress} onChange={e=>setProgress(e.target.value)} style={{marginTop:8}} />
              </div>

              {/* Row 5: WARRANTY SECTION */}
              <div className="section-title">
                <Icon name="shield" size={18} color="var(--accent-emerald)" />
                <span>{t('warrantyHeading')}</span>
              </div>
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('hasWarrantyLabel')}</label>
                  <select className="form-select" value={hasWarranty} onChange={e=>setHasWarranty(e.target.value)}>
                    <option value="yes">🛡️ {t('warrantyIn')}</option>
                    <option value="no">❌ {t('warrantyNone')}</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">{t('warrantyYearsLabel')}</label>
                  <input 
                    type="number" 
                    min="0" 
                    step="0.5" 
                    className="form-input" 
                    placeholder="1, 2, 3..." 
                    value={warrantyYears} 
                    onChange={e=>setWarrantyYears(e.target.value)} 
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('warrantyStartLabel')}</label>
                  <input 
                    type="date" 
                    className="form-input" 
                    value={warrantyStartDate} 
                    onChange={e=>setWarrantyStartDate(e.target.value)} 
                  />
                </div>
              </div>

              {/* Row 6: Description */}
              <div className="form-group" style={{marginTop:12}}>
                <label className="form-label">{t('formDescription')}</label>
                <textarea className="form-textarea" rows="3" placeholder={t('formDescription')} value={description} onChange={e=>setDescription(e.target.value)}></textarea>
              </div>

              {/* Row 7: ATTACHED DOCUMENTS */}
              <div className="section-title">
                <Icon name="paperclip" size={18} color="var(--primary)" />
                <span>{t('docTitle')}</span>
              </div>
              <div>
                <input type="file" multiple id="doc-upload" style={{display:'none'}} onChange={handleFileUpload} />
                <label htmlFor="doc-upload" className="btn btn-secondary" style={{cursor:'pointer', display:'inline-flex'}}>
                  <Icon name="paperclip" size={16} /> {t('docUploadBtn')}
                </label>

                {documents.length === 0 ? (
                  <p style={{fontSize:'0.85rem', color:'var(--text-muted)', marginTop:10, fontStyle:'italic'}}>{t('noDocsMsg')}</p>
                ) : (
                  <div className="document-list">
                    {documents.map(doc => (
                      <div key={doc.id} className="document-item">
                        <div className="document-info">
                          <Icon name="fileText" size={18} color="var(--primary)" />
                          <div>
                            <div style={{fontWeight:600}}>{doc.name}</div>
                            <div style={{fontSize:'0.75rem', color:'var(--text-muted)'}}>{doc.size} • {doc.date}</div>
                          </div>
                        </div>
                        <button type="button" className="btn-icon" style={{padding:4, color:'var(--accent-rose)', border:'none'}} onClick={() => handleRemoveDocument(doc.id)} title={t('deleteProject')}>
                          <Icon name="trash" size={14} color="var(--accent-rose)" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* SUBMIT BUTTONS */}
              <div style={{display:'flex', justifyContent:'flex-end', gap:10, marginTop:24}}>
                <button type="button" className="btn btn-secondary" onClick={handleSafeClose}>{t('btnCancel')}</button>
                <button type="submit" className="btn btn-primary"><Icon name="save" size={16} /> {t('btnSaveProject')}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // PROJECT DETAIL MODAL
    function ProjectDetailModal({ project, onClose, onUpdate, onEditProject, onDeleteProject, lang = 'th', canEdit = true, currentUser = null, onRequireLogin = null }) {
      const t = (key) => translations[lang]?.[key] || translations['th']?.[key] || key;
      const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'tasks' | 'logs'
      const [newTaskText, setNewTaskText] = useState('');

      // Task Edit & Drag state
      const [editingTaskId, setEditingTaskId] = useState(null);
      const [editingTaskText, setEditingTaskText] = useState('');
      const [editingTaskWeight, setEditingTaskWeight] = useState('0');
      const [draggedTaskIdx, setDraggedTaskIdx] = useState(null);
      const [newTaskProgress, setNewTaskProgress] = useState('0');

      // Sub-Task state
      const [expandedTaskIds, setExpandedTaskIds] = useState(new Set());
      const [newSubTaskTexts, setNewSubTaskTexts] = useState({});
      const [newSubTaskWeights, setNewSubTaskWeights] = useState({});
      const [editingSubTaskId, setEditingSubTaskId] = useState(null);
      const [editingSubTaskText, setEditingSubTaskText] = useState('');
      const [editingSubTaskWeight, setEditingSubTaskWeight] = useState('0');

      const [expenseTitle, setExpenseTitle] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expenseCategory, setExpenseCategory] = useState('ค่าวัสดุอุปกรณ์');
      const [expenseDate, setExpenseDate] = useState(new Date().toISOString().slice(0, 10));
      const [editingExpenseId, setEditingExpenseId] = useState(null);

      const handleSaveExpense = (e) => {
        if (e) e.preventDefault();
        if (!expenseTitle.trim() || !expenseAmount) return;

        const amountVal = parseFloat(expenseAmount.toString().replace(/,/g, '')) || 0;
        const currentExpenses = project.expenses || [];

        let updatedExpenses;
        if (editingExpenseId) {
          updatedExpenses = currentExpenses.map(exp => exp.id === editingExpenseId ? {
            ...exp,
            title: expenseTitle.trim(),
            amount: amountVal,
            category: expenseCategory,
            date: expenseDate
          } : exp);
        } else {
          const newExp = {
            id: 'exp-' + Date.now(),
            title: expenseTitle.trim(),
            amount: amountVal,
            category: expenseCategory,
            date: expenseDate || new Date().toISOString().slice(0, 10)
          };
          updatedExpenses = [newExp, ...currentExpenses];
        }

        // Calculate new total actual cost
        const newTotalActualCost = updatedExpenses.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

        // Update project with new expenses AND update costPlan to match actual cost sum!
        onUpdate({
          ...project,
          expenses: updatedExpenses,
          actualCost: newTotalActualCost.toString()
        });

        // Reset form
        setExpenseTitle('');
        setExpenseAmount('');
        setExpenseCategory('ค่าวัสดุอุปกรณ์');
        setEditingExpenseId(null);
        setExpenseDate(new Date().toISOString().slice(0, 10));
      };

      const handleStartEditExpense = (exp) => {
        setEditingExpenseId(exp.id);
        setExpenseTitle(exp.title || '');
        setExpenseAmount(exp.amount || '');
        setExpenseCategory(exp.category || 'ค่าวัสดุอุปกรณ์');
        setExpenseDate(exp.date || new Date().toISOString().slice(0, 10));
      };

      const handleCancelEditExpense = () => {
        setEditingExpenseId(null);
        setExpenseTitle('');
        setExpenseAmount('');
        setExpenseCategory('ค่าวัสดุอุปกรณ์');
        setExpenseDate(new Date().toISOString().slice(0, 10));
      };

      const handleDeleteExpense = (expId) => {
        if (confirm(lang === 'en' ? 'Delete this expense item?' : 'ยืนยันการลบรายการค่าใช้จ่ายนี้หรือไม่?')) {
          const updatedExpenses = (project.expenses || []).filter(e => e.id !== expId);
          const newTotalActualCost = updatedExpenses.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
          onUpdate({
            ...project,
            expenses: updatedExpenses,
            actualCost: newTotalActualCost.toString()
          });
          if (editingExpenseId === expId) handleCancelEditExpense();
        }
      };

      // Gantt Dates Edit State
      const [editingDatesTaskId, setEditingDatesTaskId] = useState(null);
      const [editPlanStart, setEditPlanStart] = useState('');
      const [editPlanEnd, setEditPlanEnd] = useState('');
      const [editActualStart, setEditActualStart] = useState('');
      const [editActualEnd, setEditActualEnd] = useState('');

      const handleStartEditDates = (task) => {
        setEditingDatesTaskId(task.id);
        setEditPlanStart(task.planStartDate || project.startDate || '');
        setEditPlanEnd(task.planEndDate || project.targetDate || '');
        setEditActualStart(task.actualStartDate || task.planStartDate || project.startDate || '');
        setEditActualEnd(task.actualEndDate || (task.completed ? (task.planEndDate || project.targetDate || '') : ''));
      };

      const handleSaveTaskDates = (taskId) => {
        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              planStartDate: editPlanStart,
              planEndDate: editPlanEnd,
              actualStartDate: editActualStart,
              actualEndDate: editActualEnd
            };
          }
          return t;
        });
        onUpdate({ ...project, tasks: updatedTasks });
        setEditingDatesTaskId(null);
      };

      const toggleExpandTask = (taskId) => {
        setExpandedTaskIds(prev => {
          const next = new Set(prev);
          if (next.has(taskId)) {
            next.delete(taskId);
          } else {
            next.add(taskId);
          }
          return next;
        });
      };

      const getTaskCompletedProgress = (task) => {
        const parentWeight = task.weight !== undefined ? Number(task.weight) : (task.progress !== undefined ? Number(task.progress) : 0);
        if (task.subtasks && task.subtasks.length > 0) {
          return task.subtasks.reduce((sum, st) => sum + (st.completed ? Number(st.weight || 0) : 0), 0);
        }
        return task.completed ? parentWeight : 0;
      };

      const calcOverallProgress = (tasksList, fallbackProgress) => {
        if (!tasksList || tasksList.length === 0) return fallbackProgress || 0;
        const checkedSum = tasksList.reduce((sum, t) => sum + getTaskCompletedProgress(t), 0);
        return Math.min(100, Math.max(0, Math.round(checkedSum)));
      };

      const calcTotalTaskWeight = (tasksList) => {
        if (!tasksList || tasksList.length === 0) return 0;
        return tasksList.reduce((sum, t) => {
          const w = t.weight !== undefined ? Number(t.weight) : (t.progress !== undefined ? Number(t.progress) : 0);
          return sum + (isNaN(w) ? 0 : w);
        }, 0);
      };

      const handleDragStart = (e, index) => {
        setDraggedTaskIdx(index);
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      };

      const handleDrop = (e, dropIndex) => {
        e.preventDefault();
        if (draggedTaskIdx === null || draggedTaskIdx === dropIndex) return;
        const newTasks = [...(project.tasks || [])];
        const [movedItem] = newTasks.splice(draggedTaskIdx, 1);
        newTasks.splice(dropIndex, 0, movedItem);
        onUpdate({ ...project, tasks: newTasks });
        setDraggedTaskIdx(null);
      };

      const handleMoveTask = (index, direction) => {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= (project.tasks || []).length) return;
        const newTasks = [...(project.tasks || [])];
        const [movedItem] = newTasks.splice(index, 1);
        newTasks.splice(newIndex, 0, movedItem);
        onUpdate({ ...project, tasks: newTasks });
      };
      
      // Log State
      const [editingLog, setEditingLog] = useState(null);
      const [logDate, setLogDate] = useState(new Date().toISOString().slice(0, 10));
      const [logTitle, setLogTitle] = useState('');
      const [logHours, setLogHours] = useState('1');
      const [logNotes, setLogNotes] = useState('');

      // Picture / Image State
      const [previewImage, setPreviewImage] = useState(null);

      const [isUploading, setIsUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');

      const handleImageUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        setIsUploading(true);
        setUploadMsg(lang === 'en' ? '⚡ Compressing & saving photos...' : '⚡ กำลังบีบอัดและจัดเก็บรูปภาพ...');

        try {
          const newImages = [];
          for (const file of files) {
            const compressedUrl = await compressImage(file, 1280, 1280, 0.78);
            newImages.push({
              id: 'img-' + Date.now() + Math.random().toString(36).substr(2, 5),
              name: file.name,
              caption: file.name.replace(/\.[^/.]+$/, ""),
              date: new Date().toISOString().slice(0, 10),
              dataUrl: compressedUrl
            });
          }
          const updatedProj = { ...project, images: [...(project.images || []), ...newImages] };
          onUpdate(updatedProj);
          setUploadMsg(lang === 'en' ? `✅ Uploaded ${newImages.length} photo(s) successfully!` : `✅ บันทึกและบีบอัดรูปภาพ ${newImages.length} ภาพ เรียบร้อยแล้วค่ะ! (ประหยัดพื้นที่ 95%)`);
          setTimeout(() => setUploadMsg(''), 4500);
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          setIsUploading(false);
        }
      };

      const handleDeleteImage = (imgId) => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบรูปภาพนี้?')) {
          const updatedImages = (project.images || []).filter(img => img.id !== imgId);
          onUpdate({ ...project, images: updatedImages });
        }
      };

      const handleToggleTask = (taskId) => {
        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === taskId) {
            const nextCompleted = !t.completed;
            const updatedSubtasks = (t.subtasks || []).map(st => ({
              ...st,
              completed: nextCompleted
            }));
            return {
              ...t,
              completed: nextCompleted,
              subtasks: updatedSubtasks
            };
          }
          return t;
        });

        const overallProgress = calcOverallProgress(updatedTasks, project.progress);
        
        if (overallProgress === 100 && window.confetti) {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }

        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress,
          status: overallProgress === 100 ? 'completed' : project.status
        });
      };

      const handleToggleSubTask = (parentTaskId, subTaskId) => {
        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === parentTaskId) {
            const updatedSubtasks = (t.subtasks || []).map(st => {
              if (st.id === subTaskId) {
                return { ...st, completed: !st.completed };
              }
              return st;
            });
            const allCompleted = updatedSubtasks.length > 0 && updatedSubtasks.every(st => st.completed);
            return {
              ...t,
              completed: allCompleted,
              subtasks: updatedSubtasks
            };
          }
          return t;
        });

        const overallProgress = calcOverallProgress(updatedTasks, project.progress);
        
        if (overallProgress === 100 && window.confetti) {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }

        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress,
          status: overallProgress === 100 ? 'completed' : project.status
        });
      };

      const handleAddSubTask = (parentTask) => {
        const text = (newSubTaskTexts[parentTask.id] || '').trim();
        if (!text) return;

        const newW = Math.max(0, parseInt(newSubTaskWeights[parentTask.id] || '0', 10) || 0);
        const parentW = parentTask.weight !== undefined ? Number(parentTask.weight) : 0;
        const currentSubSum = (parentTask.subtasks || []).reduce((sum, st) => sum + Number(st.weight || 0), 0);

        if (currentSubSum + newW > parentW) {
          alert(`⚠️ % น้ำหนักของงานย่อย Sub-Task รวมกันเกินน้ำหนักของ Task หลัก!\n\n(ปัจจุบันมีอยู่ ${currentSubSum}% + เพิ่มอีก ${newW}% = ${currentSubSum + newW}% ซึ่งเกินน้ำหนักของ Task หลักที่มี ${parentW}%)`);
          return;
        }

        const newSubTask = {
          id: 'st-' + Date.now() + Math.random().toString(36).substr(2, 4),
          text: text,
          weight: newW,
          completed: false
        };

        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === parentTask.id) {
            const nextSubtasks = [...(t.subtasks || []), newSubTask];
            return {
              ...t,
              subtasks: nextSubtasks,
              completed: false
            };
          }
          return t;
        });

        const overallProgress = calcOverallProgress(updatedTasks, project.progress);
        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress
        });

        setNewSubTaskTexts(prev => ({ ...prev, [parentTask.id]: '' }));
        setNewSubTaskWeights(prev => ({ ...prev, [parentTask.id]: '0' }));
      };

      const handleStartEditSubTask = (subTask) => {
        setEditingSubTaskId(subTask.id);
        setEditingSubTaskText(subTask.text);
        setEditingSubTaskWeight(subTask.weight !== undefined ? subTask.weight : 0);
      };

      const handleSaveEditSubTask = (parentTask, subTaskId) => {
        if (!editingSubTaskText.trim()) return;
        const newW = Math.max(0, parseInt(editingSubTaskWeight, 10) || 0);
        const parentW = parentTask.weight !== undefined ? Number(parentTask.weight) : 0;
        const otherSubSum = (parentTask.subtasks || []).filter(st => st.id !== subTaskId).reduce((sum, st) => sum + Number(st.weight || 0), 0);

        if (otherSubSum + newW > parentW) {
          alert(`⚠️ % น้ำหนักของงานย่อย Sub-Task รวมกันเกินน้ำหนักของ Task หลัก!\n\n(งานย่อยอื่นรวม ${otherSubSum}% + แก้ไขเป็น ${newW}% = ${otherSubSum + newW}% ซึ่งเกินน้ำหนักของ Task หลักที่มี ${parentW}%)`);
          return;
        }

        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === parentTask.id) {
            const updatedSubtasks = (t.subtasks || []).map(st => {
              if (st.id === subTaskId) {
                return {
                  ...st,
                  text: editingSubTaskText.trim(),
                  weight: newW
                };
              }
              return st;
            });
            return {
              ...t,
              subtasks: updatedSubtasks
            };
          }
          return t;
        });

        const overallProgress = calcOverallProgress(updatedTasks, project.progress);
        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress
        });

        setEditingSubTaskId(null);
        setEditingSubTaskText('');
        setEditingSubTaskWeight('0');
      };

      const handleCancelEditSubTask = () => {
        setEditingSubTaskId(null);
        setEditingSubTaskText('');
        setEditingSubTaskWeight('0');
      };

      const handleDeleteSubTask = (parentTaskId, subTaskId) => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบงานย่อย Sub-Task นี้?')) {
          const updatedTasks = (project.tasks || []).map(t => {
            if (t.id === parentTaskId) {
              const updatedSubtasks = (t.subtasks || []).filter(st => st.id !== subTaskId);
              const allCompleted = updatedSubtasks.length > 0 && updatedSubtasks.every(st => st.completed);
              return {
                ...t,
                subtasks: updatedSubtasks,
                completed: allCompleted
              };
            }
            return t;
          });
          const overallProgress = calcOverallProgress(updatedTasks, project.progress);
          onUpdate({
            ...project,
            tasks: updatedTasks,
            progress: overallProgress
          });
        }
      };

      const handleTaskWeightChange = (taskId, newWeightVal) => {
        const wVal = Math.min(100, Math.max(0, parseInt(newWeightVal, 10) || 0));
        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              weight: wVal,
              progress: wVal
            };
          }
          return t;
        });

        const overallProgress = calcOverallProgress(updatedTasks, project.progress);

        if (overallProgress === 100 && window.confetti) {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }

        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress,
          status: overallProgress === 100 ? 'completed' : project.status
        });
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskText.trim()) return;
        const initialW = Math.min(100, Math.max(0, parseInt(newTaskProgress, 10) || 0));
        const newTask = { 
          id: 't-' + Date.now(), 
          text: newTaskText.trim(), 
          completed: false,
          weight: initialW,
          progress: initialW
        };
        const updatedTasks = [...(project.tasks || []), newTask];
        const overallProgress = calcOverallProgress(updatedTasks, project.progress);

        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress,
          status: overallProgress === 100 ? 'completed' : project.status
        });
        setNewTaskText('');
        setNewTaskProgress('0');
      };

      const handleStartEditTask = (task) => {
        setEditingTaskId(task.id);
        setEditingTaskText(task.text);
        setEditingTaskWeight(task.weight !== undefined ? task.weight : (task.progress !== undefined ? task.progress : 0));
      };

      const handleSaveEditTask = (taskId) => {
        if (!editingTaskText.trim()) return;
        const newW = Math.min(100, Math.max(0, parseInt(editingTaskWeight, 10) || 0));
        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              text: editingTaskText.trim(),
              weight: newW,
              progress: newW
            };
          }
          return t;
        });

        const overallProgress = calcOverallProgress(updatedTasks, project.progress);

        onUpdate({
          ...project,
          tasks: updatedTasks,
          progress: overallProgress,
          status: overallProgress === 100 ? 'completed' : project.status
        });

        setEditingTaskId(null);
        setEditingTaskText('');
        setEditingTaskWeight('0');
      };

      const handleCancelEditTask = () => {
        setEditingTaskId(null);
        setEditingTaskText('');
        setEditingTaskWeight('0');
      };

      const handleDeleteTask = (taskId) => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบรายการ WBS/TASK นี้?')) {
          const updatedTasks = (project.tasks || []).filter(t => t.id !== taskId);
          const overallProgress = calcOverallProgress(updatedTasks, project.progress);
          onUpdate({
            ...project,
            tasks: updatedTasks,
            progress: overallProgress
          });
        }
      };

      const handleSaveLog = (e) => {
        e.preventDefault();
        if (!logTitle.trim()) return;

        let updatedLogs;
        if (editingLog) {
          updatedLogs = (project.logs || []).map(l => l.id === editingLog.id ? {
            ...l,
            date: logDate,
            title: logTitle.trim(),
            hoursSpent: parseFloat(logHours) || 0,
            notes: logNotes.trim()
          } : l);
        } else {
          const newLog = {
            id: 'l-' + Date.now(),
            date: logDate || new Date().toISOString().slice(0, 10),
            title: logTitle.trim(),
            hoursSpent: parseFloat(logHours) || 0,
            notes: logNotes.trim()
          };
          updatedLogs = [newLog, ...(project.logs || [])];
        }

        onUpdate({ ...project, logs: updatedLogs });
        handleCancelEditLog();
      };

      const handleStartEditLog = (log) => {
        setEditingLog(log);
        setLogTitle(log.title || '');
        setLogHours(log.hoursSpent || '1');
        setLogNotes(log.notes || '');
        setLogDate(log.date || new Date().toISOString().slice(0, 10));
      };

      const handleCancelEditLog = () => {
        setEditingLog(null);
        setLogTitle('');
        setLogNotes('');
        setLogHours('1');
        setLogDate(new Date().toISOString().slice(0, 10));
      };

      const handleDeleteLog = (logId) => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบบันทึกงานประจำวันนี้?')) {
          const updatedLogs = (project.logs || []).filter(l => l.id !== logId);
          onUpdate({ ...project, logs: updatedLogs });
          if (editingLog?.id === logId) handleCancelEditLog();
        }
      };

      const handleDetailSafeClose = () => {
        const tasksList = project.tasks || [];
        if (tasksList.length > 0) {
          const totalWeight = calcTotalTaskWeight(tasksList);
          if (totalWeight !== 100) {
            const confirmClose = confirm(`⚠️ แจ้งเตือน: ผลรวม % น้ำหนักของ WBS/TASK ทั้งหมดปัจจุบันรวมได้ ${totalWeight}%\n\n(เพื่อความถูกต้อง ผลรวมน้ำหนักงานทุกข้อควรเท่ากับ 100% พอดี)\n\nคุณยังต้องการปิดหน้าต่างนี้อยู่หรือไม่?`);
            if (!confirmClose) return; // User chose to stay and fix weights
          }
        }

        if (newTaskText.trim() || logTitle.trim() || logNotes.trim() || editingTaskId !== null) {
          const confirmExit = confirm('⚠️ คุณมีข้อความที่พิมพ์ค้างไว้อยู่ในช่องกรอก\n\nหากปิดหน้าต่างนี้ ข้อความที่พิมพ์ไว้จะหายไป ยืนยันที่จะปิดหรือไม่?');
          if (!confirmExit) return;
        }
        onClose();
      };

      return (
        <div className="modal-overlay">
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-header-top-bar">
                <span className="card-code" style={{fontSize:'0.82rem', fontWeight:800, color:'var(--primary)', background:'rgba(99, 102, 241, 0.15)', padding:'4px 10px', borderRadius:8, flexShrink:0}}>
                  {project.code || 'PRJ-N/A'}
                </span>

                <h2 className="desktop-only-title">
                  {project.title}
                </h2>

                <div className="modal-header-actions">
                  <button 
                    type="button" 
                    className="btn btn-secondary" 
                    style={{padding:'7px 12px', fontSize:'0.82rem', display:'inline-flex', alignItems:'center', gap:6}}
                    onClick={() => {
                      if (!canEdit && onRequireLogin) {
                        onRequireLogin();
                      } else {
                        onEditProject(project);
                      }
                    }}
                    title={t('editProject')}
                  >
                    <Icon name="edit" size={15} /> <span>{t('editProject')}</span>
                  </button>

                  <button 
                    type="button" 
                    className="btn btn-secondary" 
                    style={{padding:'7px 12px', fontSize:'0.82rem', color:'var(--accent-rose)', borderColor:'rgba(244, 63, 94, 0.3)', display:'inline-flex', alignItems:'center', gap:6}}
                    onClick={() => {
                      if (!canEdit) {
                        if (onRequireLogin) onRequireLogin();
                      } else {
                        onDeleteProject(project.id);
                      }
                    }}
                    title={t('deleteProject')}
                  >
                    <Icon name="trash" size={15} color="var(--accent-rose)" /> <span>{t('deleteProject')}</span>
                  </button>

                  <button 
                    type="button" 
                    className="btn-icon" 
                    style={{width:36, height:36, borderRadius:8, background:'rgba(255,255,255,0.06)', display:'flex', alignItems:'center', justifyContent:'center'}}
                    onClick={handleDetailSafeClose} 
                    title={t('btnCancel')}
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>
              </div>

              <h2 className="mobile-only-title">
                {project.title}
              </h2>
            </div>

            <div className="modal-body">
              {/* Tab Navigation */}
              <div className="tab-bar">
                <button className={`tab-btn ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}>
                  {t('tabOverview')}
                </button>
                <button className={`tab-btn ${activeTab === 'tasks' ? 'active' : ''}`} onClick={() => setActiveTab('tasks')}>
                  {t('tabTasks')} ({(project.tasks || []).length})
                </button>
                <button className={`tab-btn ${activeTab === 'expenses' ? 'active' : ''}`} onClick={() => setActiveTab('expenses')}>
                  {lang === 'en' ? '💰 Actual Cost' : '💰 ค่าใช้จ่ายจริง (Actual Cost)'} ({(project.expenses || []).length})
                </button>
                <button className={`tab-btn ${activeTab === 'logs' ? 'active' : ''}`} onClick={() => setActiveTab('logs')}>
                  {lang === 'en' ? '📝 Daily Work Logs' : '📝 ไดอารี่บันทึกงานประจำวัน'} ({(project.logs || []).length})
                </button>
                <button className={`tab-btn ${activeTab === 'picture' ? 'active' : ''}`} onClick={() => setActiveTab('picture')}>
                  {lang === 'en' ? '🖼️ Gallery' : '🖼️ รูปภาพโครงการ'} ({(project.images || []).length})
                </button>
              </div>

              {activeTab === 'overview' ? (
                <div>
                  <div className="form-grid-3" style={{background:'var(--bg-input)', padding:16, borderRadius:'var(--radius-sm)', marginBottom:18}}>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Project Code:</strong> <div>{project.code || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Project Owner:</strong> <div>{project.owner || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>{lang === 'en' ? 'Seller:' : 'Seller (ผู้ขายโครงการ):'}</strong> <div style={{color:'var(--primary)', fontWeight:600}}>{project.seller || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Status:</strong> <div><StatusBadge status={project.status} lang={lang} /></div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Contractor:</strong> <div>{project.contractor || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Client:</strong> <div>{project.client || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Budget:</strong> <div style={{color:'var(--accent-emerald)', fontWeight:600}}>{project.budget || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Cost Plan:</strong> <div style={{color:'var(--accent-amber)', fontWeight:600}}>{project.costPlan || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Start Date:</strong> <div>{project.startDate || '-'}</div></div>
                    <div><strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>End Date:</strong> <div>{project.targetDate || '-'}</div></div>
                    <div>
                      <strong style={{color:'var(--text-muted)', fontSize:'0.8rem'}}>Google Map:</strong> 
                      <div>
                        {project.googleMap ? (
                          <a href={project.googleMap} target="_blank" rel="noreferrer" style={{color:'var(--primary)', display:'inline-flex', alignItems:'center', gap:4}}>
                            <Icon name="mapPin" size={14} color="var(--primary)" /> {lang === 'en' ? 'View Map Location' : 'ดูพิกัดแผนที่'}
                          </a>
                        ) : '-'}
                      </div>
                    </div>
                  </div>

                  {/* Location & Description */}
                  {project.location && (
                    <div style={{marginBottom:14}}>
                      <strong style={{fontSize:'0.85rem', color:'var(--text-muted)'}}>{lang === 'en' ? 'Location:' : 'Location (สถานที่ดำเนินการ):'}</strong>
                      <p style={{fontSize:'0.9rem'}}>{project.location}</p>
                    </div>
                  )}

                  <div style={{marginBottom:20}}>
                    <strong style={{fontSize:'0.85rem', color:'var(--text-muted)'}}>Description:</strong>
                    <p style={{fontSize:'0.9rem', color:'var(--text-sub)'}}>{project.description || '-'}</p>
                  </div>

                  {/* Warranty Information Card */}
                  <div style={{background:'var(--bg-input)', padding:16, border:'1px solid var(--border-color)', borderRadius:'var(--radius-sm)', marginBottom:20}}>
                    <h4 style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                      <Icon name="shield" size={18} color="var(--accent-emerald)" />
                      <span>{t('warrantyHeading')}</span>
                    </h4>
                    {project.hasWarranty === 'yes' ? (
                      <div className="form-grid-3" style={{fontSize:'0.85rem', marginBottom:0}}>
                        <div>{lang === 'en' ? 'Warranty Status:' : 'สถานะการรับประกัน:'} <strong style={{color:'var(--accent-emerald)'}}>{lang === 'en' ? 'Active Warranty' : 'มีประกัน (Active)'}</strong></div>
                        <div>{lang === 'en' ? 'Duration:' : 'ระยะเวลารับประกัน:'} <strong>{project.warrantyYears || 0} {lang === 'en' ? 'Years' : 'ปี'}</strong></div>
                        <div>{lang === 'en' ? 'Start Date:' : 'วันที่เริ่มนับประกัน:'} <strong>{project.warrantyStartDate || '-'}</strong></div>
                      </div>
                    ) : (
                      <p style={{fontSize:'0.85rem', color:'var(--text-muted)'}}>{lang === 'en' ? 'No warranty coverage for this project' : 'ไม่มีการรับประกันสำหรับโครงการนี้'}</p>
                    )}
                  </div>

                  {/* Documents List */}
                  <div>
                    <h4 style={{marginBottom:10, display:'flex', alignItems:'center', gap:8}}>
                      <Icon name="paperclip" size={18} color="var(--primary)" />
                      <span>{lang === 'en' ? `Attached Documents (${(project.documents || []).length} files)` : `Attached documents (เอกสารแนบ ${(project.documents || []).length} ไฟล์)`}</span>
                    </h4>
                    {(project.documents || []).length === 0 ? (
                      <p style={{fontSize:'0.85rem', color:'var(--text-muted)'}}>{t('noDocsMsg')}</p>
                    ) : (
                      <div className="document-list">
                        {(project.documents || []).map(doc => (
                          <div key={doc.id} className="document-item">
                            <div className="document-info">
                              <Icon name="fileText" size={18} color="var(--primary)" />
                              <div>
                                <div style={{fontWeight:600}}>{doc.name}</div>
                                <div style={{fontSize:'0.75rem', color:'var(--text-muted)'}}>{doc.size} • {doc.date}</div>
                              </div>
                            </div>
                            {doc.dataUrl && doc.dataUrl !== '#' ? (
                              <a href={doc.dataUrl} download={doc.name} className="btn btn-secondary" style={{padding:'4px 10px', fontSize:'0.75rem'}}>
                                <Icon name="download" size={14} /> {lang === 'en' ? 'Download' : 'ดาวน์โหลด'}
                              </a>
                            ) : null}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ) : activeTab === 'tasks' ? (
                <div>
                  {/* OVERALL PROJECT PROGRESS & WEIGHT ACCUMULATION BANNER */}
                  <div style={{background:'var(--bg-input)', padding:'14px 18px', borderRadius:'var(--radius-sm)', marginBottom:16, border:'1px solid var(--border-color)'}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8, flexWrap:'wrap', gap:8}}>
                      <div>
                        <span style={{fontSize:'0.85rem', fontWeight:700}}>
                          {lang === 'en' ? '📊 Overall Project Progress (Accumulated from checked tasks ✓):' : '📊 ความก้าวหน้ารวมโครงการ (สะสมเฉพาะ WBS/TASK ที่ติ๊กถูก ✓):'}
                        </span>
                      </div>
                      <div style={{fontSize:'1.15rem', fontWeight:800, color: project.progress === 100 ? 'var(--accent-emerald)' : 'var(--primary)'}}>
                        {project.progress || 0}%
                      </div>
                    </div>
                    
                    <div className="progress-track" style={{height:10, marginBottom:10}}>
                      <div className="progress-fill" style={{ width: `${project.progress || 0}%`, background: project.progress === 100 ? 'var(--accent-emerald)' : 'linear-gradient(90deg, var(--primary), var(--accent-cyan))' }}></div>
                    </div>

                    {/* Weight Sum Validation Alert */}
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:'0.8rem', paddingTop:8, borderTop:'1px solid var(--border-color)'}}>
                      <span>{lang === 'en' ? '⚖️ Total WBS/TASK Weight Sum:' : '⚖️ ผลรวม % น้ำหนักของทุก WBS/TASK ในโครงการ:'}</span>
                      {calcTotalTaskWeight(project.tasks || []) === 100 ? (
                        <span style={{color:'var(--accent-emerald)', fontWeight:700, display:'inline-flex', alignItems:'center', gap:4}}>
                          {lang === 'en' ? '✅ Total 100% (Complete)' : '✅ รวมได้ 100% (ครบถ้วนสมบูรณ์)'}
                        </span>
                      ) : (
                        <span style={{color:'var(--accent-amber)', fontWeight:700, display:'inline-flex', alignItems:'center', gap:4}}>
                          {lang === 'en' ? `⚠️ Total ${calcTotalTaskWeight(project.tasks || [])}% (Should equal 100%)` : `⚠️ รวมได้ ${calcTotalTaskWeight(project.tasks || [])}% (ควรปรับน้ำหนักงานให้ได้ 100% พอดี)`}
                        </span>
                      )}
                    </div>
                  </div>

                  <form onSubmit={handleAddTask} style={{display:'flex', gap:10, marginBottom:16, alignItems:'center'}}>
                    <input 
                      type="text" 
                      className="form-input" 
                      placeholder={lang === 'en' ? 'Add new WBS/TASK item...' : 'เพิ่มรายการ WBS/TASK...'} 
                      value={newTaskText} 
                      onChange={e=>setNewTaskText(e.target.value)} 
                      style={{flex:1}}
                    />
                    <div style={{display:'flex', alignItems:'center', gap:4}}>
                      <input 
                        type="number" 
                        min="0" 
                        max="100" 
                        className="form-input" 
                        placeholder="0"
                        style={{width:65, textAlign:'center', padding:'8px 4px', fontSize:'0.85rem'}}
                        value={newTaskProgress} 
                        onChange={e=>setNewTaskProgress(e.target.value)} 
                        title={lang === 'en' ? 'Task Weight (%)' : 'กำหนดน้ำหนักงาน (%)'}
                      />
                      <span style={{fontSize:'0.85rem', fontWeight:600, color:'var(--primary)'}}>%</span>
                    </div>
                    <button type="submit" className="btn btn-primary"><Icon name="plus" size={16} /> {lang === 'en' ? 'Add' : 'เพิ่ม'}</button>
                  </form>

                  {(project.tasks || []).map((task, index) => {
                    const isExpanded = expandedTaskIds.has(task.id);
                    const subtasks = task.subtasks || [];
                    const subtaskSum = subtasks.reduce((s, st) => s + Number(st.weight || 0), 0);
                    const parentWeight = task.weight !== undefined ? Number(task.weight) : (task.progress !== undefined ? Number(task.progress) : 0);

                    return (
                      <div key={task.id} style={{marginBottom:10}}>
                        <div 
                          draggable={editingTaskId === null}
                          onDragStart={(e) => handleDragStart(e, index)}
                          onDragOver={handleDragOver}
                          onDrop={(e) => handleDrop(e, index)}
                          onDragEnd={() => setDraggedTaskIdx(null)}
                          className={`task-item ${task.completed ? 'completed' : ''}`}
                          style={{
                            opacity: draggedTaskIdx === index ? 0.4 : 1,
                            border: draggedTaskIdx === index ? '2px dashed var(--primary)' : '1px solid var(--border-color)',
                            cursor: editingTaskId === null ? 'grab' : 'default',
                            transition: 'opacity 0.15s ease, border 0.15s ease'
                          }}
                        >
                          <div 
                            style={{cursor:'grab', color:'var(--text-muted)', display:'flex', alignItems:'center', padding:'2px 4px'}}
                            title={lang === 'en' ? 'Drag to reorder' : 'คลิกลากสลับลำดับ'}
                          >
                            <Icon name="grip" size={16} />
                          </div>

                          <button 
                            type="button" 
                            className="btn-icon" 
                            style={{padding:2, border:'none', background:'transparent', color: isExpanded ? 'var(--primary)' : 'var(--text-muted)', cursor:'pointer', display:'flex', alignItems:'center'}}
                            onClick={() => toggleExpandTask(task.id)}
                            title={isExpanded ? (lang === 'en' ? 'Collapse Sub-Tasks' : 'พับเก็บรายการงานย่อย Sub-Task') : (lang === 'en' ? 'Expand Sub-Tasks' : 'เปิดดู / จัดการงานย่อย Sub-Task')}
                          >
                            <Icon name={isExpanded ? "chevronDown" : "chevronRight"} size={16} />
                          </button>

                          <input 
                            type="checkbox" 
                            checked={task.completed} 
                            onChange={() => handleToggleTask(task.id)}
                            style={{width:18, height:18, cursor:'pointer'}}
                          />

                          {editingTaskId === task.id ? (
                            <div style={{flex:1, display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
                              <input 
                                type="text" 
                                className="form-input" 
                                style={{padding:'4px 8px', fontSize:'0.85rem', flex:1, minWidth:180}}
                                value={editingTaskText} 
                                onChange={e => setEditingTaskText(e.target.value)} 
                                autoFocus
                              />
                              <div style={{display:'flex', alignItems:'center', gap:4}}>
                                <span style={{fontSize:'0.75rem', color:'var(--text-muted)'}}>{lang === 'en' ? 'Weight:' : 'น้ำหนัก:'}</span>
                                <input 
                                  type="number" 
                                  min="0" 
                                  max="100" 
                                  className="form-input" 
                                  style={{width:55, padding:'2px 4px', textAlign:'center', fontSize:'0.85rem', height:28}}
                                  value={editingTaskWeight} 
                                  onChange={e => setEditingTaskWeight(e.target.value)} 
                                />
                                <span style={{fontSize:'0.8rem', fontWeight:600, color:'var(--primary)'}}>%</span>
                              </div>
                              <button type="button" className="btn btn-primary" style={{padding:'4px 10px', fontSize:'0.75rem'}} onClick={() => handleSaveEditTask(task.id)}>
                                <Icon name="save" size={14} /> {lang === 'en' ? 'Save' : 'บันทึก'}
                              </button>
                              <button type="button" className="btn btn-secondary" style={{padding:'4px 10px', fontSize:'0.75rem'}} onClick={handleCancelEditTask}>
                                {t('btnCancel')}
                              </button>
                            </div>
                          ) : (
                            <>
                              <span 
                                style={{flex:1, fontSize:'0.9rem', cursor:'pointer', display:'flex', alignItems:'center', gap:6}} 
                                onClick={() => toggleExpandTask(task.id)}
                                title={lang === 'en' ? 'Click to expand sub-tasks' : 'คลิกเพื่อแตก/พับดูงานย่อย Sub-Task'}
                              >
                                {task.text}
                                {subtasks.length > 0 && (
                                  <span style={{fontSize:'0.72rem', background:'rgba(59, 130, 246, 0.15)', color:'var(--primary)', padding:'1px 6px', borderRadius:10, fontWeight:600, border:'1px solid rgba(59, 130, 246, 0.3)'}}>
                                    🌿 {lang === 'en' ? `Sub-tasks ${subtasks.filter(st => st.completed).length}/${subtasks.length}` : `งานย่อย ${subtasks.filter(st => st.completed).length}/${subtasks.length}`}
                                  </span>
                                )}
                              </span>
                              
                              {/* Task Planned Weight % Read-Only Badge */}
                              <div style={{fontSize:'0.8rem', background:'var(--bg-card)', padding:'3px 10px', borderRadius:6, border:'1px solid var(--border-color)', color:'var(--text-muted)', marginRight:6}}>
                                {lang === 'en' ? 'Weight:' : 'น้ำหนัก:'} <strong style={{color:'var(--primary)', fontWeight:700}}>{parentWeight}%</strong>
                              </div>

                              <div style={{display:'flex', gap:4, alignItems:'center'}}>
                                <button type="button" className="btn-icon" style={{padding:4, border:'none', width:26, height:26}} onClick={() => handleMoveTask(index, -1)} disabled={index === 0} title={lang === 'en' ? 'Move Up' : 'ย้ายขึ้น'}>
                                  <Icon name="arrowUp" size={14} />
                                </button>
                                <button type="button" className="btn-icon" style={{padding:4, border:'none', width:26, height:26}} onClick={() => handleMoveTask(index, 1)} disabled={index === (project.tasks || []).length - 1} title={lang === 'en' ? 'Move Down' : 'ย้ายลง'}>
                                  <Icon name="arrowDown" size={14} />
                                </button>
                                <button type="button" className="btn-icon" style={{padding:4, border:'none', width:26, height:26}} onClick={() => handleStartEditTask(task)} title={lang === 'en' ? 'Edit WBS/TASK & Weight %' : 'แก้ไข WBS/TASK และ % น้ำหนัก'}>
                                  <Icon name="edit" size={14} />
                                </button>
                                <button type="button" className="btn-icon" style={{padding:4, border:'none', width:26, height:26, color:'var(--accent-rose)'}} onClick={() => handleDeleteTask(task.id)} title={lang === 'en' ? 'Delete Task' : 'ลบ WBS/TASK'}>
                                  <Icon name="trash" size={14} color="var(--accent-rose)" />
                                </button>
                              </div>
                            </>
                          )}
                        </div>

                        {/* SUB-TASKS NESTED LADDER CONTAINER */}
                        {isExpanded && (
                          <div style={{marginLeft:32, marginTop:8, borderLeft:'2px dashed var(--primary)', paddingLeft:14, display:'flex', flexDirection:'column', gap:8}}>
                            {/* Sub-Task Weight Summary Banner */}
                            <div style={{fontSize:'0.8rem', color:'var(--text-muted)', display:'flex', alignItems:'center', justifyContent:'space-between', background:'var(--bg-input)', padding:'6px 12px', borderRadius:6, border:'1px solid var(--border-color)', flexWrap:'wrap', gap:6}}>
                              <span>
                                {lang === 'en' ? `🌿 Sub-Tasks (${subtasks.length}): Total Weight ${subtaskSum}% / ${parentWeight}%` : `🌿 รายการงานย่อย (Sub-Tasks): ${subtasks.length} รายการ | รวม % น้ำหนักย่อย: ${subtaskSum}% / ${parentWeight}%`}
                              </span>
                              {subtaskSum === parentWeight ? (
                                <span style={{color:'var(--accent-emerald)', fontSize:'0.75rem', fontWeight:600}}>
                                  {lang === 'en' ? `✅ Sub-task weight matches task weight (${parentWeight}%)` : `✅ รวม % งานย่อยครบถ้วนสมบูรณ์ (${parentWeight}%)`}
                                </span>
                              ) : subtaskSum < parentWeight ? (
                                <span style={{color:'var(--accent-amber)', fontSize:'0.75rem'}}>
                                  {lang === 'en' ? `⚠️ Incomplete sub-task weight (Missing ${parentWeight - subtaskSum}%)` : `⚠️ รวม % งานย่อยยังไม่ครบ (ขาดอีก ${parentWeight - subtaskSum}%)`}
                                </span>
                              ) : (
                                <span style={{color:'var(--accent-rose)', fontSize:'0.75rem', fontWeight:600}}>
