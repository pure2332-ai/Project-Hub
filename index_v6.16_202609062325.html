                      <Icon name="image" size={48} color="var(--text-muted)" />
                      <h4 style={{marginTop:12}}>{lang === 'en' ? 'No project photos yet' : 'ยังไม่มีรูปภาพโครงการ'}</h4>
                      <p style={{fontSize:'0.85rem', marginTop:4}}>{lang === 'en' ? 'Click "Upload Photo" button above to add site photos.' : 'กดปุ่ม "อัปโหลดรูปภาพ" ด้านบนเพื่อเพิ่มรูปถ่ายหน้างานได้เลยครับ'}</p>
                    </div>
                  ) : (
                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:16}}>
                      {(galleryPhotos || []).map(img => (
                        <div key={img.id} style={{background:'var(--bg-input)', border:'1px solid var(--border-color)', borderRadius:'var(--radius-sm)', overflow:'hidden', display:'flex', flexDirection:'column'}}>
                          <div style={{height:130, overflow:'hidden', position:'relative', cursor:'pointer'}} onClick={() => setPreviewImage(img)}>
                            <img src={img.dataUrl || img.thumbUrl} alt={img.caption} style={{width:'100%', height:'100%', objectFit:'cover', transition:'transform 0.3s ease'}} />
                          </div>
                          <div style={{padding:'8px 10px', display:'flex', justifyContent:'space-between', alignItems:'center', background:'var(--bg-card)'}}>
                            <div style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontSize:'0.75rem', fontWeight:600}} title={img.caption}>
                              {img.caption}
                            </div>
                            <button type="button" className="btn-icon" style={{width:24, height:24, padding:2, color:'var(--accent-rose)', border:'none', flexShrink:0}} onClick={() => handleDeleteImage(img.id)} title={lang === 'en' ? 'Delete photo' : 'ลบรูปภาพ'}>
                              <Icon name="trash" size={13} color="var(--accent-rose)" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* LIGHTBOX IMAGE PREVIEW MODAL */}
                  {previewImage && (
                    <div className="modal-overlay" style={{zIndex:2100}} onClick={() => setPreviewImage(null)}>
                      <div style={{position:'relative', maxWidth:'90vw', maxHeight:'90vh'}} onClick={e=>e.stopPropagation()}>
                        <button type="button" className="btn-icon" style={{position:'absolute', top:10, right:10, background:'rgba(0,0,0,0.6)', color:'#fff', border:'none'}} onClick={() => setPreviewImage(null)}>
                          <Icon name="x" size={20} />
                        </button>
                        <img src={previewImage.dataUrl || previewImage.thumbUrl} alt={previewImage.caption} style={{maxWidth:'100%', maxHeight:'80vh', borderRadius:12, objectFit:'contain', boxShadow:'0 20px 40px rgba(0,0,0,0.8)'}} />
                        <div style={{textAlign:'center', color:'#fff', marginTop:10, fontSize:'0.9rem', fontWeight:600}}>{previewImage.caption} ({previewImage.date})</div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // BACKUP MODAL
    function BackupModal({ projects, onClose, onImport, lang = 'th' }) {
      const t = (key) => translations[lang]?.[key] || translations['th']?.[key] || key;

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `project_hub_backup_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchor.click();
      };

      const handleFileImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) onImport(imported);
          } catch(err) {
            alert(lang === 'en' ? 'Invalid JSON file' : 'ไฟล์ JSON ไม่ถูกต้อง');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="modal-overlay">
          <div className="modal-card" style={{maxWidth: 480}} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{t('backupTitle')}</div>
              <button type="button" className="btn-icon" onClick={onClose} title="Close">
                <Icon name="x" size={20} />
              </button>
            </div>
            <div className="modal-body" style={{display:'flex', flexDirection:'column', gap:16}}>
              <div style={{padding:16, border:'1px solid var(--border-color)', borderRadius:'var(--radius-sm)'}}>
                <h4 style={{marginBottom:6}}>📥 {t('backupExportBtn')}</h4>
                <p style={{fontSize:'0.85rem', color:'var(--text-muted)', marginBottom:12}}>
                  {lang === 'en' ? 'Export all project data into a JSON backup file stored on your machine.' : 'บันทึกข้อมูลโปรเจกต์ทั้งหมดออกเป็นไฟล์ JSON เก็บไว้บนเครื่อง'}
                </p>
                <button className="btn btn-primary" onClick={handleExport} style={{width:'100%', justifyContent:'center'}}>
                  <Icon name="download" size={16} /> {t('backupExportBtn')}
                </button>
              </div>

              <div style={{padding:16, border:'1px solid var(--border-color)', borderRadius:'var(--radius-sm)'}}>
                <h4 style={{marginBottom:6}}>📤 {t('backupImportBtn')}</h4>
                <p style={{fontSize:'0.85rem', color:'var(--text-muted)', marginBottom:12}}>
                  {t('backupImportLabel')}
                </p>
                <input type="file" accept=".json" onChange={handleFileImport} style={{display:'none'}} id="import-file" />
                <label htmlFor="import-file" className="btn btn-secondary" style={{width:'100%', justifyContent:'center', cursor:'pointer'}}>
                  <Icon name="upload" size={16} /> {t('backupImportBtn')}
                </label>
              </div>

              <div style={{padding:16, border:'1px solid var(--border-color)', borderRadius:'var(--radius-sm)'}}>
                <h4 style={{marginBottom:6}}>🔄 {lang === 'en' ? 'Reset to Default Sample Data' : 'โหลดข้อมูลตัวอย่างเริ่มต้น (Reset Demo Data)'}</h4>
                <p style={{fontSize:'0.85rem', color:'var(--text-muted)', marginBottom:12}}>
                  {lang === 'en' ? 'Reload the 9 original sample engineering projects with milestones & EVM.' : 'กู้คืนโครงการตัวอย่างเริ่มต้นทั้ง 9 โครงการพร้อมข้อมูลงวดเงินและ EVM'}
                </p>
                <button 
                  type="button"
                  className="btn btn-secondary" 
                  onClick={() => {
                    const pin = prompt(lang === 'en' ? 'Enter Security PIN (2332) to load default sample projects:' : 'กรุณากรอกรหัสความปลอดภัย (2332) เพื่อโหลดโครงการตัวอย่าง:');
                    if (pin === SECURITY_PIN) {
                      onImport(defaultProjects);
                      CloudSyncService.seedInitialProjects(defaultProjects);
                    } else if (pin !== null) {
                      alert(lang === 'en' ? '❌ Invalid Security PIN' : '❌ รหัสผ่านความปลอดภัยไม่ถูกต้องค่ะ');
                    }
                  }} 
                  style={{width:'100%', justifyContent:'center'}}
                >
                  <Icon name="refreshCw" size={16} /> {lang === 'en' ? 'Load Demo Projects (9 items)' : 'โหลด 9 โครงการตัวอย่าง'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render React App with ErrorBoundary Guard
    try {
      const container = document.getElementById('root');
      if (ReactDOM.createRoot) {
        const root = ReactDOM.createRoot(container);
        root.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      } else if (ReactDOM.render) {
        ReactDOM.render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>,
          container
        );
      }
    } catch (err) {
      console.error('Fatal mount error:', err);
      document.getElementById('root').innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b0f17; color:#fff; font-family:Prompt,sans-serif; text-align:center; padding:20px;"><div style="max-width:500px; background:#1e293b; padding:30px; border-radius:16px; border:1px solid #f43f5e;"><h3 style="color:#f43f5e; margin-bottom:10px;">⚠️ ระบบกู้คืนการทำงาน</h3><p style="color:#94a3b8; font-size:0.9rem;">' + (err ? err.message : '') + '</p><button id="btn-reset-cache-fatal" style="margin-top:15px; padding:10px 20px; background:#6366f1; color:#fff; border:none; border-radius:8px; cursor:pointer;">ล้างข้อมูลและเริ่มต้นใหม่</button></div></div>';
      var btnFatal = document.getElementById('btn-reset-cache-fatal');
      if (btnFatal) {
        btnFatal.onclick = function() {
          var inputPin = prompt('🔒 ยืนยันรหัสความปลอดภัย:\n\nกรุณากรอกรหัสผ่าน 4 หลัก (2332) เพื่อล้างข้อมูลและเริ่มต้นใหม่:');
          if (inputPin === '2332') {
            localStorage.clear();
            if (window.indexedDB) indexedDB.deleteDatabase('project_hub_db');
            location.reload();
          } else if (inputPin !== null) {
            alert('❌ รหัสผ่านไม่ถูกต้อง');
          }
        };
      }
    }
  </script>
</body>
</html>
