<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>Project Hub - ระบบติดตามและบันทึกผลงานโปรเจกต์</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  
  <!-- Leaflet OpenStreetMap CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Fonts: Inter & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External Libraries (CDN with High Speed & Reliability & Offline Mirrors) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script>window.React || document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\\/script>')</script>
  
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>window.ReactDOM || document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\\/script>')</script>
  
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script>window.Babel || document.write('<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"><\\/script>')</script>

  <style>
    /* ==========================================================================
       DESIGN SYSTEM & THEME TOKENS (LIGHT & DARK DUAL MODE)
       ========================================================================== */
    :root {
      /* Dark Theme Tokens (Default) */
      --bg-main: #0b0f17;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-hover: rgba(30, 41, 59, 0.85);
      --bg-modal: #111827;
      --bg-input: #1e293b;
      --bg-pill: #1e293b;
      --bg-pill-active: #4f46e5;
      
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.4);

      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;

      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: rgba(99, 102, 241, 0.15);

      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.5);

      --font-family: 'Prompt', 'Inter', -apple-system, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      /* Light Theme Tokens */
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-modal: #ffffff;
      --bg-input: #f1f5f9;
      --bg-pill: #e2e8f0;
      --bg-pill-active: #4f46e5;
      
      --border-color: #e2e8f0;
      --border-hover: #6366f1;

      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;

      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(79, 70, 229, 0.08);

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 24px -6px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Container Layout */
    .app-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 80px 20px;
    }

    /* Header / Navbar */
    .navbar {
      position: relative;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-icon:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
    }

    /* Nav Button with Tooltip Wrapper */
    .nav-btn-wrap {
      position: relative;
      display: inline-flex;
    }
    .nav-btn-wrap .nav-tooltip {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: rgba(15, 23, 42, 0.95);
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 9999;
    }
    .nav-btn-wrap .nav-tooltip::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 5px solid rgba(15, 23, 42, 0.95);
    }
    .nav-btn-wrap:hover .nav-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .nav-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.1);
      margin: 0 2px;
      flex-shrink: 0;
    }
    .nav-tab-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      cursor: pointer;
      transition: var(--transition);
    }
    .nav-tab-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
    }
    .nav-tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(99, 102, 241, 0.3));
      border-color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.35), inset 0 0 12px rgba(6, 182, 212, 0.1);
    }

    /* Stats Banner */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .stat-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-icon-total { background: rgba(99, 102, 241, 0.15); color: var(--primary); }
    .stat-icon-active { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
    .stat-icon-done { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    /* Toolbar & Search Bar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      height: 42px;
      padding: 0 16px 0 42px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
      backdrop-filter: blur(12px);
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .form-select {
      height: 42px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
      cursor: pointer;
    }

    .view-toggle {
      display: flex;
      height: 42px;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 3px;
      border-radius: var(--radius-md);
    }

    .view-toggle-btn {
      height: 100%;
      padding: 0 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-toggle-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* Projects Grid Layout */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* Project Card */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      position: relative;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: 0 16px 32px -10px rgba(99, 102, 241, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-code {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .card-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-draft { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-planning { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
    .badge-in-progress { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
    .badge-completed { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
    .badge-on-hold { background: rgba(234, 179, 8, 0.18); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-cancel { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Progress Bar */
    .progress-wrapper {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-stats {
      display: flex;
      gap: 12px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Table View */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .projects-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .projects-table th {
      background: var(--bg-input);
      padding: 14px 18px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .projects-table td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      vertical-align: middle;
    }

    .projects-table tr:last-child td {
      border-bottom: none;
    }

    .projects-table tr:hover td {
      background: var(--bg-card-hover);
    }

    .projects-table tr:last-child td {
      border-bottom: none;
    }

    .projects-table tr:hover td {
      background: var(--bg-card-hover);
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-modal);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--bg-modal);
      z-index: 10;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .modal-body {
      padding: 24px;
    }

    /* Form Fields */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Section Divider Title */
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      margin: 18px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tasks / Checklist */
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }

    .task-item.completed {
      opacity: 0.6;
      text-decoration: line-through;
    }

    /* Document List */
    .document-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .document-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
    }

    .document-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      font-family: inherit;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';

      color: #fff;

      border-radius: var(--radius-sm);

    /* Electrical Engineering Loading Popup Overlay */
    .electrical-loader-overlay {
      position: fixed;
      top: 0;
      left: 0;

      height: 100vh;
      background: rgba(11, 15, 23, 0.92);

      height: 84px;

      align-items: center;
      justify-content: center;

      position: absolute;
      width: 84px;
      height: 84px;
      border: 3px solid transparent;
      border-top-color: var(--accent-cyan);
      border-right-color: var(--primary);
      border-radius: 50%;
      animation: electricSpin 1s linear infinite;

      height: 60px;

      border-left-color: var(--accent-emerald);

    const formatCurrency = (val, currentLang = 'th') => {
      const num = parseNumber(val);
      if (!num || num === 0) return currentLang === 'en' ? '฿0.00 THB' : '฿0.00 บาท';

      if (num >= 1e9) {
        return currentLang === 'en'
          ? '฿' + (num / 1e9).toFixed(2) + 'B THB'
          : '฿' + (num / 1e9).toFixed(2) + ' พันล้านบาท';
      }
      if (num >= 1e6) {
        return currentLang === 'en'
          ? '฿' + (num / 1e6).toFixed(2) + 'M THB'
          : '฿' + (num / 1e6).toFixed(2) + ' ล้านบาท';
      }
      if (num >= 1e3) {
        return currentLang === 'en'
          ? '฿' + (num / 1e3).toFixed(2) + 'K THB'
          : '฿' + (num / 1e3).toFixed(2) + ' พันบาท';
      }
      return '฿' + num.toFixed(2) + (currentLang === 'en' ? ' THB' : ' บาท');
    };

    // Global Compact Financial Currency Formatter (Bilingual THB / บาท, Max 3 lines)
    const formatCompactCurrency = (val, prefix = '', currentLang = 'th') => {
      if (val === null || val === undefined || val === '' || val === '-') {
        return prefix ? `${prefix}: -` : '-';
      }
      const num = parseFloat(val.toString().replace(/,/g, '').replace(/[^0-9.]/g, ''));
      if (isNaN(num) || num === 0) {
        return prefix ? `${prefix}: -` : '-';
      }
      const unit = currentLang === 'en' ? ' THB' : ' บาท';
      let formatted = '';
      if (num >= 1000000) {
        const millionVal = num / 1000000;
        formatted = (millionVal % 1 === 0 ? millionVal.toFixed(0) : millionVal.toFixed(2)) + 'M' + unit;
      } else if (num >= 100000) {
        const millionVal = num / 1000000;
        formatted = millionVal.toFixed(2) + 'M' + unit;
      } else {
        formatted = num.toLocaleString('en-US') + unit;
      }
      return prefix ? `${prefix}: ${formatted}` : formatted;
    };

    // ==========================================================================
    function compressImage(file, maxWidth, maxHeight, quality) {
      maxWidth = maxWidth || 1024;
      maxHeight = maxHeight || 1024;
      quality = quality || 0.72;

      // Modern hardware-accelerated decode for mobile browsers (iOS Safari & Android Chrome)
      if (typeof window.createImageBitmap === 'function') {
        return createImageBitmap(file).then(function(bitmap) {
          var width = bitmap.width;
          var height = bitmap.height;

          if (width > maxWidth || height > maxHeight) {
            if (width / height > maxWidth / maxHeight) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0, width, height);

          var compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          if (compressedDataUrl.length > 600 * 1024) {
            compressedDataUrl = canvas.toDataURL('image/jpeg', 0.5);
          }
          return compressedDataUrl;
        }).catch(function(err) {
          console.warn('createImageBitmap fallback:', err);
          return fallbackCompress(file, maxWidth, maxHeight, quality);
        });
      }

      return fallbackCompress(file, maxWidth, maxHeight, quality);
    }

    function fallbackCompress(file, maxWidth, maxHeight, quality) {
      return new Promise(function(resolve, reject) {
        if (!file.type || !file.type.startsWith('image/')) {
          var reader = new FileReader();
          reader.onload = function(e) { resolve(e.target.result); };
          reader.onerror = reject;
          reader.readAsDataURL(file);
          return;
        }

        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var width = img.width;
            var height = img.height;

            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            var canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            try {
              var compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
              if (compressedDataUrl.length > 600 * 1024) {
                compressedDataUrl = canvas.toDataURL('image/jpeg', 0.5);
              }
              resolve(compressedDataUrl);
            } catch (err) {
              resolve(e.target.result);
            }
          };
          img.onerror = function() { resolve(e.target.result); };
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // High-efficiency micro thumbnail & compressor for instant grid rendering & offline caching
    function generateThumbnail(dataUrl, size, quality) {
      if (!dataUrl || !dataUrl.startsWith('data:image')) return Promise.resolve(dataUrl);
      var maxDim = size || 240;
      var q = quality !== undefined ? quality : 0.65;
      return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() {
          var w = img.width;
          var h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          try {
            resolve(canvas.toDataURL('image/jpeg', q));
          } catch (e) {
            resolve(dataUrl);
          }
        };
        img.onerror = function() { resolve(dataUrl); };
        img.src = dataUrl;
      });
    }

    var ProjectStorage = {
      dbPromise: null,
      getDB: function() {
        if (!this.dbPromise) {
          this.dbPromise = new Promise(function(resolve) {
            if (!window.indexedDB) {
              resolve(null);
              return;
            }
            try {
              var req = indexedDB.open('project_hub_db', 1);
              req.onupgradeneeded = function(e) {
                var db = e.target.result;
                if (!db.objectStoreNames.contains('store')) {
                  db.createObjectStore('store');
                }
              };
              req.onsuccess = function(e) { resolve(e.target.result); };
              req.onerror = function() { resolve(null); };
            } catch (ex) {
              resolve(null);
            }
          });
        }
        return this.dbPromise;
      },
      get: function(key) {
        return this.getDB().then(function(db) {
          if (!db) {
            var raw = localStorage.getItem(key);
            try { return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
          }
          return new Promise(function(resolve) {
            try {
              var tx = db.transaction('store', 'readonly');
              var req = tx.objectStore('store').get(key);
              req.onsuccess = function() { resolve(req.result !== undefined ? req.result : null); };
              req.onerror = function() { resolve(null); };
            } catch(ex) {
              resolve(null);
            }
          });
        });
      },
      set: function(key, val) {
        // 1. Save to IndexedDB (Supports gigabytes of photos safely)
        try {
          this.getDB().then(function(db) {
            if (db) {
              var tx = db.transaction('store', 'readwrite');
              tx.objectStore('store').put(val, key);
            }
          });
        } catch (e) {
          console.warn('IndexedDB write error:', e);
        }

        // 2. Safe LocalStorage Shield (with fallback trimming)
        try {
          localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val));
        } catch (err) {
          console.warn('LocalStorage quota limit reached, data protected in IndexedDB:', err);
          try {
            if (Array.isArray(val)) {
              var lightCopy = val.map(function(p) {
                return Object.assign({}, p, {
                  images: (p.images || []).map(function(img) {
                    return Object.assign({}, img, { dataUrl: img.thumbUrl || '' });
                  })
                });
              });
              localStorage.setItem(key, JSON.stringify(lightCopy));
            }
          } catch (e2) {}
        }
      }
    };

    const parseDateStringToMs = (dStr) => {
      if (!dStr || typeof dStr !== 'string') return null;
      const str = dStr.trim();
      if (!str) return null;

      // 1. Format YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        const d = new Date(str + 'T00:00:00');
        return isNaN(d.getTime()) ? null : d.getTime();
      }

      // 2. Format DD/MM/YYYY or DD-MM-YYYY
      if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(str)) {
        const parts = str.split(/[\/\-]/);
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        let year = parseInt(parts[2], 10);
        if (year > 2500) year -= 543;
        const d = new Date(year, month, day);
        return isNaN(d.getTime()) ? null : d.getTime();
      }

      // 3. Fallback standard parse
      const fallback = new Date(str);
      return isNaN(fallback.getTime()) ? null : fallback.getTime();
    };

    // ==========================================================================
    // EARNED VALUE MANAGEMENT (EVM) & RISK EVALUATION ENGINE (PMI / IEEE STANDARD)
    // ==========================================================================
    const calculateEVM = (project, asOfDateStr) => {
      if (!project) return { bac:0, pv:0, ev:0, ac:0, sv:0, cv:0, spi:1, cpi:1, eac:0, vac:0, plannedPct:0, actualProgressPct:0, health:'on-track' };
      const asOfMs = asOfDateStr ? parseDateStringToMs(asOfDateStr) : Date.now();
      const costPlan = parseNumber(project.costPlan || project.budget || 0);
      const totalBudget = parseNumber(project.budget || costPlan || 0);
      const bac = costPlan > 0 ? costPlan : totalBudget; // Budget At Completion

      // Planned Progress % calculation based on project timeline
      const pStartMs = parseDateStringToMs(project.startDate) || (Date.now() - 30 * 86400000);
      const pTargetMs = parseDateStringToMs(project.targetDate) || (Date.now() + 60 * 86400000);
      const totalDuration = Math.max(1, pTargetMs - pStartMs);
      const elapsed = Math.max(0, Math.min(totalDuration, asOfMs - pStartMs));

      // S-curve Sigmoid approximation function: 3*t^2 - 2*t^3
      let plannedPct = 0;
      if (asOfMs < pStartMs) {
        plannedPct = 0;
      } else if (asOfMs >= pTargetMs) {
        plannedPct = 100;
      } else {
        const t = elapsed / totalDuration;
        plannedPct = Math.round((3 * Math.pow(t, 2) - 2 * Math.pow(t, 3)) * 100);
      }

      // Check if sCurveOverrides exists for current month
      if (project.sCurveOverrides && typeof project.sCurveOverrides === 'object') {
        const curDate = new Date(asOfMs);
        const mKey = `${curDate.getFullYear()}-${String(curDate.getMonth() + 1).padStart(2, '0')}`;
        if (project.sCurveOverrides[mKey] !== undefined && project.sCurveOverrides[mKey] !== '') {
          plannedPct = Math.max(0, Math.min(100, parseNumber(project.sCurveOverrides[mKey])));
        }
      }

      const actualProgressPct = parseNumber(project.progress || 0);
      
      // Calculate Actual Cost (AC)
      let actualCost = 0;
      if (project.expenses && Array.isArray(project.expenses) && project.expenses.length > 0) {
        actualCost = project.expenses.reduce((sum, exp) => sum + parseNumber(exp.amount || 0), 0);
      } else {
        actualCost = parseNumber(project.actualCost || project.costSpent || 0);
      }

      // Core EVM Formulas (PMI Standard)
      const pv = (plannedPct / 100) * bac; // Planned Value
      const ev = (actualProgressPct / 100) * bac; // Earned Value
      const ac = actualCost; // Actual Cost

      const sv = ev - pv; // Schedule Variance (THB)
      const cv = ev - ac; // Cost Variance (THB)

      // Performance Indexes (SPI & CPI)
      let spi = 1.0;
      if (pv > 0) {
        spi = ev / pv;
      } else {
        spi = actualProgressPct >= plannedPct ? 1.0 : (plannedPct > 0 ? actualProgressPct / plannedPct : 1.0);
      }

      let cpi = 1.0;
      if (ac > 0) {
        cpi = ev / ac;
      } else {
        cpi = ev > 0 ? 1.2 : 1.0;
      }

      // Estimate At Completion (EAC) & Variance At Completion (VAC)
      const eac = cpi > 0 ? (bac / cpi) : (bac + (ac - ev));
      const vac = bac - eac;

      // Determine Health Classification
      let health = 'on-track';
      if (actualProgressPct === 100) {
        health = ac <= bac ? 'completed-good' : 'completed-overbudget';
      } else if (spi >= 1.05 && cpi >= 1.0) {
        health = 'ahead';
      } else if (spi >= 0.95 && cpi >= 0.95) {
        health = 'on-track';
      } else if (spi < 0.95 && cpi < 0.95) {
        health = 'critical';
      } else if (spi < 0.95) {
        health = 'schedule-delay';
      } else if (cpi < 0.95) {
        health = 'budget-overrun';
      }

      return {
        bac: Math.round(bac),
        pv: Math.round(pv),
        ev: Math.round(ev),
        ac: Math.round(ac),
        sv: Math.round(sv),
        cv: Math.round(cv),
        spi: parseFloat(spi.toFixed(2)),
        cpi: parseFloat(cpi.toFixed(2)),
        eac: Math.round(eac),
        vac: Math.round(vac),
        plannedPct,
        actualProgressPct,
        health
      };
    };

    const evaluateProjectRisks = (projects) => {
      const now = Date.now();
      const scheduleRisks = [];
      const budgetRisks = [];
      const warrantyRisks = [];

      (Array.isArray(projects) ? projects : []).forEach(p => {
        if (!p || typeof p !== 'object') return;
        const evm = calculateEVM(p);
        const targetMs = parseDateStringToMs(p.targetDate);
        const isOverdueTime = targetMs && targetMs < now && (p.progress || 0) < 100 && p.status !== 'completed' && p.status !== 'cancel';

        // 1. Schedule Risk (Delay): SPI < 0.95 or Target date passed
        if ((evm.spi < 0.95 || isOverdueTime) && p.status !== 'completed' && p.status !== 'cancel') {
          scheduleRisks.push({
            project: p,
            projectId: p.id,
            type: 'schedule',
            level: (isOverdueTime || evm.spi < 0.8) ? 'critical' : 'warning',
            title: isOverdueTime ? 'เลยกำหนดส่งมอบตามสัญญา' : `ความก้าวหน้าล่าช้ากว่าแผน (SPI: ${evm.spi})`,
            titleEn: isOverdueTime ? 'Project delivery target date is overdue' : `Schedule performance behind plan (SPI: ${evm.spi})`,
            detail: `ทำจริง ${p.progress || 0}% / แผน ${evm.plannedPct}% (ผลต่าง SV: ${formatCurrency(evm.sv)})`,
            detailEn: `Actual ${p.progress || 0}% / Planned ${evm.plannedPct}% (SV: ${formatCurrency(evm.sv, 'en')})`
          });
        }

        // 2. Budget Risk (Overrun): Actual Cost > Cost Plan or CPI < 0.95
        const costPlan = parseNumber(p.costPlan || p.budget || 0);
        const actualCost = evm.ac;
        if ((actualCost > costPlan || evm.cpi < 0.95) && costPlan > 0 && p.status !== 'cancel') {
          const overAmount = actualCost - costPlan;
          budgetRisks.push({
            project: p,
            projectId: p.id,
            type: 'budget',
            level: actualCost > costPlan ? 'critical' : 'warning',
            title: actualCost > costPlan ? `ต้นทุนจริงเกินงบประมาณ (+${formatCurrency(overAmount)})` : `ดัชนีต้นทุนมีความเสี่ยง (CPI: ${evm.cpi})`,
            titleEn: actualCost > costPlan ? `Actual cost exceeded budget (+${formatCurrency(overAmount, 'en')})` : `Cost index at risk (CPI: ${evm.cpi})`,
            detail: `จ่ายจริง ${formatCurrency(actualCost)} / แผน ${formatCurrency(costPlan)} (CV: ${formatCurrency(evm.cv)})`,
            detailEn: `Spent ${formatCurrency(actualCost, 'en')} / Plan ${formatCurrency(costPlan, 'en')} (CV: ${formatCurrency(evm.cv, 'en')})`
          });
        }

        // 3. Warranty Risk: Expiring within 60 days
        if (p.hasWarranty === 'yes' && p.warrantyStartDate && p.warrantyYears) {
          const startMs = parseDateStringToMs(p.warrantyStartDate);
          if (startMs) {
            const endD = new Date(startMs);
            endD.setFullYear(endD.getFullYear() + Number(p.warrantyYears));
            const endMs = endD.getTime();
            const daysLeft = Math.ceil((endMs - now) / (1000 * 60 * 60 * 24));

            if (daysLeft <= 60 && daysLeft >= 0) {
              warrantyRisks.push({
                project: p,
                projectId: p.id,
                type: 'warranty',
                level: daysLeft <= 15 ? 'critical' : 'warning',
                title: `การรับประกันใกล้หมดอายุ (เหลือ ${daysLeft} วัน)`,
                titleEn: `Warranty expiring soon (${daysLeft} days remaining)`,
                detail: `หมดประกันวันที่ ${endD.toISOString().slice(0, 10)} (ระยะเวลารวม ${p.warrantyYears} ปี)`,
                detailEn: `Expires on ${endD.toISOString().slice(0, 10)} (${p.warrantyYears} Years Total)`
              });
            } else if (daysLeft < 0 && daysLeft > -30) {
              warrantyRisks.push({
                project: p,
                projectId: p.id,
                type: 'warranty',
                level: 'info',
                title: `เพิ่งหมดระยะเวลารับประกัน (หมดแล้ว ${Math.abs(daysLeft)} วัน)`,
                titleEn: `Warranty recently expired (${Math.abs(daysLeft)} days ago)`,
                detail: `หมดสัญญาประกันเมื่อ ${endD.toISOString().slice(0, 10)}`,
                detailEn: `Expired on ${endD.toISOString().slice(0, 10)}`
              });
            }
          }
        }
      });

      return {
        scheduleRisks,
        budgetRisks,
        warrantyRisks,
        totalCount: scheduleRisks.length + budgetRisks.length + warrantyRisks.length,
        allRisks: [...scheduleRisks, ...budgetRisks, ...warrantyRisks]
      };
    };

    // REUSABLE GANTT CHART & S-CURVE TIMELINE PANEL COMPONENT
    function ProjectGanttChartPanel({ project, onUpdate, lang = 'th' }) {
      const t = (key) => translations[lang]?.[key] || translations['th']?.[key] || key;
      const monthNames = translations[lang]?.months || translations['th'].months;

            // Actual Cost / Expenses state
      


      const [editingDatesTaskId, setEditingDatesTaskId] = useState(null);
      const [editPlanStart, setEditPlanStart] = useState('');
      const [editPlanEnd, setEditPlanEnd] = useState('');
      const [editActualStart, setEditActualStart] = useState('');
      const [editActualEnd, setEditActualEnd] = useState('');

      // S-Curve Overrides state
      const [showSCurveModal, setShowSCurveModal] = useState(false);
      const [editingSCurveOverrides, setEditingSCurveOverrides] = useState({});

      // Expanded Task IDs in Gantt Chart
      const [expandedGanttTaskIds, setExpandedGanttTaskIds] = useState(new Set());

      const toggleExpandGanttTask = (taskId) => {
        setExpandedGanttTaskIds(prev => {
          const next = new Set(prev);
          if (next.has(taskId)) next.delete(taskId);
          else next.add(taskId);
          return next;
        });
      };

      const handleOpenSCurveModal = () => {
        setEditingSCurveOverrides({ ...(project.sCurveOverrides || {}) });
        setShowSCurveModal(true);
      };

      const handleSaveSCurveOverrides = () => {
        onUpdate({
          ...project,
          sCurveOverrides: editingSCurveOverrides
        });
        setShowSCurveModal(false);
      };

      const handleResetAllSCurveOverrides = () => {
        setEditingSCurveOverrides({});
      };

      const handleResetSingleSCurveOverride = (monthKey) => {
        setEditingSCurveOverrides(prev => {
          const next = { ...prev };
          delete next[monthKey];
          return next;
        });
      };

      const handleStartEditDates = (task) => {
        setEditingDatesTaskId(task.id);
        setEditPlanStart(task.planStartDate || project.startDate || '');
        setEditPlanEnd(task.planEndDate || project.targetDate || '');
        setEditActualStart(task.actualStartDate || task.planStartDate || project.startDate || '');
        setEditActualEnd(task.actualEndDate || (task.completed ? (task.planEndDate || project.targetDate || '') : ''));
      };

      const handleSaveTaskDates = (taskId) => {
        const updatedTasks = (project.tasks || []).map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              planStartDate: editPlanStart,
              planEndDate: editPlanEnd,
              actualStartDate: editActualStart,
              actualEndDate: editActualEnd
            };
          }
          return t;
        });

        // Calculate exact min task start date and max task end date
        const tStarts = [];
        const tEnds = [];
        updatedTasks.forEach(t => {
          [t.planStartDate, t.actualStartDate].forEach(dStr => {
            const ms = parseDateStringToMs(dStr);
            if (ms) tStarts.push(ms);
          });
          [t.planEndDate, t.actualEndDate].forEach(dStr => {
            const ms = parseDateStringToMs(dStr);
            if (ms) tEnds.push(ms);
          });
        });

        let newProjStart = project.startDate;
        let newProjTarget = project.targetDate;

        if (tStarts.length > 0) {
          const minMs = Math.min(...tStarts);
          const d = new Date(minMs);
          newProjStart = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        if (tEnds.length > 0) {
          const maxMs = Math.max(...tEnds);
          const d = new Date(maxMs);
          newProjTarget = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        onUpdate({ 
          ...project, 
          startDate: newProjStart,
          targetDate: newProjTarget,
          tasks: updatedTasks 
        });
        setEditingDatesTaskId(null);
      };

      const tasksList = project.tasks || [];

      // Gather task start and end timestamps
      const taskStartMs = [];
      const taskEndMs = [];

      tasksList.forEach(t => {
        [t.planStartDate, t.actualStartDate].forEach(dStr => {
          const ms = parseDateStringToMs(dStr);
          if (ms) taskStartMs.push(ms);
        });
        [t.planEndDate, t.actualEndDate].forEach(dStr => {
          const ms = parseDateStringToMs(dStr);
          if (ms) taskEndMs.push(ms);
        });
      });

      let minStartMs, maxEndMs;

      if (taskStartMs.length > 0 && taskEndMs.length > 0) {
        minStartMs = Math.min(...taskStartMs);
        maxEndMs = Math.max(...taskEndMs);
      } else {
        const pStart = parseDateStringToMs(project.startDate);
        const pTarget = parseDateStringToMs(project.targetDate);
        minStartMs = pStart || new Date('2026-01-01').getTime();
        maxEndMs = pTarget || new Date('2026-12-31').getTime();
      }

      const startDateObj = new Date(minStartMs);
      const targetDateObj = new Date(maxEndMs);

      // Generate Monthly Timeline Scale Columns from start month to end month
      const timelineColumns = [];
      let currDate = new Date(startDateObj.getFullYear(), startDateObj.getMonth(), 1);
      const endDateLimit = new Date(targetDateObj.getFullYear(), targetDateObj.getMonth() + 1, 1);

      while (currDate <= endDateLimit && timelineColumns.length < 36) {
        const mIndex = currDate.getMonth();
        const yyyy = currDate.getFullYear();
        const mm = String(mIndex + 1).padStart(2, '0');
        const monthKey = `${yyyy}-${mm}`;

        let monthLabel;
        if (lang === 'en') {
          const yr = yyyy.toString().substring(2);
          monthLabel = `${monthNames[mIndex]} '${yr}`;
        } else {
          const yr = (yyyy + 543).toString().substring(2);
          monthLabel = `${monthNames[mIndex]} ${yr}`;
        }
        timelineColumns.push({
          label: monthLabel,
          monthKey: monthKey,
          timeMs: currDate.getTime()
        });
        currDate.setMonth(currDate.getMonth() + 1);
      }

      if (timelineColumns.length < 2) {
        timelineColumns.push({ label: 'Start', monthKey: 'start', timeMs: minStartMs });
        timelineColumns.push({ label: 'End', monthKey: 'end', timeMs: maxEndMs });
      }

      const pStartMs = timelineColumns[0].timeMs;
      const pTargetMs = timelineColumns[timelineColumns.length - 1].timeMs > pStartMs 
        ? timelineColumns[timelineColumns.length - 1].timeMs 
        : pStartMs + (30 * 24 * 60 * 60 * 1000);

      // S-Curve Points mapped to monthly scale
      const sCurvePoints = timelineColumns.map((col) => {
        const pct = Math.max(0, Math.min(100, ((col.timeMs - pStartMs) / (pTargetMs - pStartMs)) * 100));
        const stepMs = col.timeMs;
        const cumProgress = tasksList.reduce((sum, t) => {
          const w = t.weight !== undefined ? Number(t.weight) : 0;
          const tPlanEndMs = t.planEndDate ? new Date(t.planEndDate).getTime() : (pStartMs + (pTargetMs - pStartMs) * 0.8);
          const tActualEndMs = t.actualEndDate ? new Date(t.actualEndDate).getTime() : (t.completed ? tPlanEndMs : null);
          
          if (t.completed) {
            if (!tActualEndMs || stepMs >= tActualEndMs) return sum + w;
            return sum;
          }
          if (t.subtasks && t.subtasks.length > 0) {
            const doneSubWeight = t.subtasks.reduce((sSum, st) => sSum + (st.completed ? Number(st.weight || 0) : 0), 0);
            return sum + doneSubWeight;
          }
          return sum;
        }, 0);

        const autoVal = Math.min(100, Math.round(cumProgress));
        const customVal = project.sCurveOverrides?.[col.monthKey];
        const isCustom = customVal !== undefined && customVal !== null && customVal !== '' && !isNaN(Number(customVal));
        const finalVal = isCustom ? Math.max(0, Math.min(100, Number(customVal))) : autoVal;

        return { 
          pct, 
          val: finalVal, 
          autoVal,
          isCustom,
          label: col.label,
          monthKey: col.monthKey 
        };
      });

      // EVM Metric Calculation for this project
      const evm = calculateEVM(project);
      const [timeScale, setTimeScale] = useState('month'); // 'day' | 'week' | 'month' | 'quarter'

      return (
        <div>
          {/* EVM (EARNED VALUE MANAGEMENT) PERFORMANCE HEADER */}
          <div style={{background:'var(--bg-card)', padding:14, borderRadius:'var(--radius-sm)', marginBottom:14, border:'1px solid var(--border-color)', boxShadow:'var(--shadow-sm)'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, flexWrap:'wrap', gap:8}}>
              <div style={{display:'flex', alignItems:'center', gap:8}}>
                <span style={{fontSize:'0.88rem', fontWeight:800, color:'var(--accent-cyan)', display:'flex', alignItems:'center', gap:6}}>
                  <Icon name="barChart" size={16} color="var(--accent-cyan)" />
                  {t('evmTitle')}
                </span>
                <span className={`evm-health-badge evm-health-${evm.health.includes('good') || evm.health === 'ahead' ? 'good' : (evm.health === 'critical' ? 'critical' : 'warning')}`}>
                  {evm.health === 'ahead' ? t('evmStatusAhead') : evm.health === 'on-track' ? t('evmStatusOnTrack') : evm.health === 'schedule-delay' ? t('evmStatusDelay') : evm.health === 'budget-overrun' ? t('evmStatusOverbudget') : evm.health === 'critical' ? t('evmStatusCritical') : 'COMPLETED'}
                </span>
              </div>

              {/* Timescale Selector & Actions */}
              <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
                <div className="timescale-pill-group">
                  <button type="button" className={`timescale-pill ${timeScale === 'day' ? 'active' : ''}`} onClick={() => setTimeScale('day')}>Day</button>
                  <button type="button" className={`timescale-pill ${timeScale === 'week' ? 'active' : ''}`} onClick={() => setTimeScale('week')}>Week</button>
                  <button type="button" className={`timescale-pill ${timeScale === 'month' ? 'active' : ''}`} onClick={() => setTimeScale('month')}>Month</button>
                  <button type="button" className={`timescale-pill ${timeScale === 'quarter' ? 'active' : ''}`} onClick={() => setTimeScale('quarter')}>Quarter</button>
                </div>

                <button 
                  type="button" 
                  className="btn btn-secondary" 
                  style={{padding:'4px 10px', fontSize:'0.75rem', display:'inline-flex', alignItems:'center', gap:5}}
                  onClick={() => window.print()}
                  title="พิมพ์ / บันทึกไทม์ไลน์"
                >
                  <Icon name="printer" size={13} />
                  <span>{lang === 'en' ? 'Print' : 'พิมพ์กราฟ'}</span>
                </button>
              </div>
            </div>

            {/* EVM 8 Metrics Cards Grid */}
            <div className="evm-kpi-grid">
              <div className="evm-metric-card">
                <div style={{fontSize:'0.65rem', color:'var(--text-muted)', fontWeight:700}}>BAC (งบแผนงาน)</div>
                <div style={{fontSize:'0.92rem', fontWeight:800, color:'var(--text-main)'}}>{formatCurrency(evm.bac, lang)}</div>
                <div style={{fontSize:'0.6rem', color:'var(--text-muted)'}}>Budget At Completion</div>
              </div>
              <div className="evm-metric-card">
                <div style={{fontSize:'0.65rem', color:'var(--text-muted)', fontWeight:700}}>PV (มูลค่าตามแผน)</div>
                <div style={{fontSize:'0.92rem', fontWeight:800, color:'var(--primary)'}}>{formatCurrency(evm.pv, lang)}</div>
                <div style={{fontSize:'0.6rem', color:'var(--text-muted)'}}>{evm.plannedPct}% of BAC</div>
              </div>
              <div className="evm-metric-card">
                <div style={{fontSize:'0.65rem', color:'var(--text-muted)', fontWeight:700}}>EV (มูลค่างานจริง)</div>
                <div style={{fontSize:'0.92rem', fontWeight:800, color:'var(--accent-cyan)'}}>{formatCurrency(evm.ev, lang)}</div>
                <div style={{fontSize:'0.6rem', color:'var(--text-muted)'}}>{evm.actualProgressPct}% of BAC</div>

              <div className="evm-metric-card">
                <div style={{fontSize:'0.65rem', color:'var(--text-muted)', fontWeight:700}}>AC (ต้นทุนจ่ายจริง)</div>
                <div style={{fontSize:'0.92rem', fontWeight:800, color: evm.ac > evm.bac ? 'var(--accent-rose)' : 'var(--accent-emerald)'}}>{formatCurrency(evm.ac, lang)}</div>
                <div style={{fontSize:'0.6rem', color:'var(--text-muted)'}}>Actual Cost Spent</div>
              </div>
              <div className="evm-metric-card">
                <div style={{fontSize:'0.65rem', color:'var(--text-muted)', fontWeight:700}}>SPI (ดัชนีเวลา)</div>
                <div style={{fontSize:'1.05rem', fontWeight:900, color: evm.spi >= 1.0 ? 'var(--accent-emerald)' : (evm.spi >= 0.95 ? 'var(--accent-cyan)' : 'var(--accent-rose)')}}>
                  {evm.spi}

              </div>
              <div className="evm-metric-card">
                <div style={{fontSize:'0.65rem', color:'var(--text-muted)', fontWeight:700}}>CPI (ดัชนีต้นทุน)</div>
                <div style={{fontSize:'1.05rem', fontWeight:900, color: evm.cpi >= 1.0 ? 'var(--accent-emerald)' : (evm.cpi >= 0.95 ? 'var(--accent-cyan)' : 'var(--accent-rose)')}}>
                  {evm.cpi}
                </div>
                <div style={{fontSize:'0.6rem', color:'var(--text-muted)'}}>EV / AC {evm.cpi < 0.95 ? '⚠️ Over' : '✅ OK'}</div>

              <div className="evm-metric-card">

                <div style={{fontSize:'0.6rem', color:'var(--text-muted)'}}>Forecast Cost</div>

                  <div style={{display:'flex', alignItems:'center', gap:6}}>

                    <div style={{width:18, height:0, borderTop:'2px dashed #10b981', filter:'drop-shadow(0 0 4px #10b981)'}}></div>
                    <span>{t('legendSCurve')}</span>

                {/* S-CURVE ADJUSTMENT BUTTON */}
                <button

                    padding:'6px 14px',

                  onClick={handleOpenSCurveModal} 
                  title="คลิกเพื่อเปิดป็อปอัพปรับแต่ง % S-Curve รายเดือน"

                </button>

            </div>
          </div>

          {/* GANTT CHART & S-CURVE TABLE AREA */}
          {tasksList.length === 0 ? (
            <div className="empty-state" style={{padding:30}}>
              <Icon name="list" size={48} color="var(--text-muted)" />
              <h4 style={{marginTop:12}}>{t('noTasksMsg')}</h4>
            </div>
          ) : (
            <div style={{position:'relative', background:'var(--bg-card)', border:'1px solid var(--border-color)', borderRadius:'var(--radius-sm)', padding:16, overflowX:'auto'}}>
              
              {/* GANTT TABLE HEADER WITH MONTH SCALE */}
              <div style={{display:'flex', borderBottom:'2px solid var(--border-color)', paddingBottom:10, fontSize:'0.8rem', fontWeight:700, color:'var(--text-muted)'}}>
                <div style={{width:200, flexShrink:0}}>{t('tableWbs')}</div>
                <div style={{width:65, textAlign:'center', flexShrink:0}}>{t('tableWeight')}</div>
                <div style={{width:65, textAlign:'center', flexShrink:0}}>{t('tablePercentDone')}</div>
                <div style={{flex:1, minWidth:400, position:'relative', display:'flex', justifyContent:'space-between', padding:'0 10px'}}>
                  {timelineColumns.map((col, idx) => (
                    <div key={idx} style={{fontSize:'0.75rem', fontWeight:700, color:'var(--accent-cyan)', textAlign:'center', whiteSpace:'nowrap'}}>

              {/* GANTT ROWS WITH BARS */}
              <div style={{position:'relative', marginTop:10, display:'flex', flexDirection:'column', gap:12}}>
                
                {/* S-CURVE SVG OVERLAY LINE (NEON GREEN DASHED UNIFORM LINE) */}

                  style={{position:'absolute', top:0, left:330, width:'calc(100% - 420px)', height:'100%', minWidth:400, pointerEvents:'none', zIndex:10}}

                >
                  <path 
                    d={sCurvePoints.reduce((acc, p, idx) => {
                      const x = p.pct;
                      const y = 100 - p.val;
                      return idx === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
                    }, '')} 
                    fill="none" 
                    stroke="#10b981" 
                    strokeWidth="2" 
                    strokeDasharray="6 4"
                    vectorEffect="non-scaling-stroke"

                <div style={{position:'absolute', top:0, left:330, width:'calc(100% - 420px)', height:'100%', minWidth:400, pointerEvents:'none', zIndex:11}}>

                      style={{

    // ==========================================================================
    // OPEN LOCATION CODE (GOOGLE PLUS CODE) DECODER ENGINE
    // Decodes full codes (e.g. 7P52M8HC+GV) and short codes (e.g. M8HC+GV6, RW26+2MQ)
    // into high-precision GPS Coordinates [Latitude, Longitude]
    // ==========================================================================
    const OLC_ALPHABET = "23456789CFGHJMPQRVWX";
    function decodeOLC(code) {
      if (!code || typeof code !== 'string') return null;
      const clean = code.replace(/[^23456789CFGHJMPQRVWX]/gi, '').toUpperCase();
      let lat = -90.0, lng = -180.0, latRes = 20.0, lngRes = 20.0;
      for (let i = 0; i < Math.min(clean.length, 10); i += 2) {
        const latIdx = OLC_ALPHABET.indexOf(clean[i]);
        const lngIdx = OLC_ALPHABET.indexOf(clean[i+1]);
        if (latIdx === -1 || lngIdx === -1) break;
        lat += latIdx * latRes;
        lng += lngIdx * lngRes;
        latRes /= 20.0;
        lngRes /= 20.0;
      }
      return [lat + latRes * 10.0, lng + lngRes * 10.0];
    }
    function getOLCPrefix(refLat, refLng) {
      let latVal = refLat + 90.0, lngVal = refLng + 180.0;
      const p1_lat = Math.floor(latVal / 20.0); latVal -= p1_lat * 20.0;
      const p1_lng = Math.floor(lngVal / 20.0); lngVal -= p1_lng * 20.0;
      const p2_lat = Math.floor(latVal / 1.0);
      const p2_lng = Math.floor(lngVal / 1.0);
      return OLC_ALPHABET[p1_lat] + OLC_ALPHABET[p1_lng] + OLC_ALPHABET[p2_lat] + OLC_ALPHABET[p2_lng];
    }
    function decodePlusCode(shortCode, refLat = 13.7563, refLng = 100.5018) {
      if (!shortCode || typeof shortCode !== 'string' || !shortCode.includes('+')) return null;
      const cleanShort = shortCode.replace('+', '').trim().toUpperCase();
      if (cleanShort.length < 6) return null;
      const prefix = cleanShort.length >= 8 ? '' : getOLCPrefix(refLat, refLng);
      const fullCode = prefix + cleanShort;
      const res = decodeOLC(fullCode);
      if (!res) return null;
      const [lat, lng] = res;
      if (!isNaN(lat) && !isNaN(lng) && lat > 5 && lat < 21 && lng > 96 && lng < 106) {
        return [Number(lat.toFixed(5)), Number(lng.toFixed(5))];
      }
      return null;
    }

    // SIEMENS ENERGY EXECUTIVE PRINT / PDF REPORT MODAL COMPONENT
            // ACCURATE GEOGRAPHIC THAILAND MAP & GLOWING ORBS (EXACT RENDER MATCHING USER MOCKUP)

    function ThailandCyberMap({ projects, lang, onSelectProject, theme = 'dark' }) {

            attribution: '',
            maxZoom: 16
          }).addTo(map);
        }

        // 77 Thai Provinces + English names Lat/Lng Dictionary for 0-latency instant mapping
        const THAI_PROVINCES_COORDS = {
          'เชียงใหม่': [18.7883, 98.9853], 'chiang mai': [18.7883, 98.9853],
          'เชียงราย': [19.9105, 99.8406], 'chiang rai': [19.9105, 99.8406],
          'ลำปาง': [18.2888, 99.4920], 'lampang': [18.2888, 99.4920],
          'ลำพูน': [18.5745, 99.0087], 'lamphun': [18.5745, 99.0087],
          'แม่ฮ่องสอน': [19.3020, 97.9654], 'mae hong son': [19.3020, 97.9654],

        console.error('React ErrorBoundary caught an exception:', error, errorInfo);

      // Helper function to render formatted Markdown in message bubbles
      const renderRichMessage = (text) => {
        if (!text) return null;

        // Split text by code blocks ```...```
        const codeBlockRegex = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
        const segments = [];
        let lastIdx = 0;
        let match;

        while ((match = codeBlockRegex.exec(text)) !== null) {
          if (match.index > lastIdx) {
            segments.push({ type: 'text', content: text.substring(lastIdx, match.index) });
          }
          segments.push({ type: 'code', lang: match[1] || 'code', content: match[2] });
          lastIdx = match.index + match[0].length;
        }
        if (lastIdx < text.length) {
          segments.push({ type: 'text', content: text.substring(lastIdx) });
        }

        return segments.map((seg, sIdx) => {
          if (seg.type === 'code') {
            return (
              <div key={`cb-${sIdx}`} style={{
                background: '#090d16',
                border: '1px solid rgba(245, 158, 11, 0.3)',

                  fontWeight: 700,

                  justifyContent: 'space-between',
                  alignItems: 'center'
                }}>

                    type="button"
                    style={{
                      background: 'transparent',
                      border: 'none',
                      color: '#94a3b8',
                      cursor: 'pointer',
                      fontSize: '0.68rem'
                    }}
                    onClick={() => {
                      navigator.clipboard.writeText(seg.content);
                      alert('คัดลอกโค้ดเรียบร้อยแล้วค่ะ!');
                    }}
                  >
                    📋 คัดลอกโค้ด
                  </button>
                </div>
                <pre style={{
                  margin: 0,
                  padding: '10px 12px',
                  overflowX: 'auto',
                  fontFamily: 'Consolas, Monaco, monospace',
                  fontSize: '0.82rem',
                  lineHeight: 1.5,
                  color: '#a5f3fc'
                }}>
                  <code>{seg.content}</code>
                </pre>
              </div>
            );
          }

          // Plain text formatting
          const lines = seg.content.split('\n');
          return lines.map((line, lIdx) => {
            const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let parts = [];
            let lLastIdx = 0;
            let lMatch;

            while ((lMatch = linkRegex.exec(line)) !== null) {
              if (lMatch.index > lLastIdx) {
                parts.push(line.substring(lLastIdx, lMatch.index));
              }
              parts.push(
                <a key={`link-${sIdx}-${lIdx}-${lMatch.index}`} href={lMatch[2]} target="_blank" rel="noreferrer">
                  {lMatch[1]} ↗
                </a>
              );
              lLastIdx = lMatch.index + lMatch[0].length;
            }
            if (lLastIdx < line.length) {
              parts.push(line.substring(lLastIdx));
            }

            const formattedLine = parts.map((p, pIdx) => {
              if (typeof p !== 'string') return p;
              
              const boldParts = p.split(/\*\*([^*]+)\*\*/g);
              return boldParts.map((bp, bIdx) => {
                if (bIdx % 2 === 1) {
                  return <strong key={`b-${sIdx}-${lIdx}-${pIdx}-${bIdx}`}>{bp}</strong>;
                }
                const codeParts = bp.split(/`([^`]+)`/g);
                return codeParts.map((cp, cIdx) => {
                  if (cIdx % 2 === 1) {
                    return <code key={`c-${sIdx}-${lIdx}-${pIdx}-${bIdx}-${cIdx}`}>{cp}</code>;
                  }
                  return cp;
                });
              });
            });

            return (
              <div key={`l-${sIdx}-${lIdx}`} style={{ minHeight: line.trim() === '' ? 8 : undefined, marginBottom: 3 }}>
                {formattedLine}
              </div>
            );
          });
        });

    function SecurityPinModal({ isOpen, onClose, onConfirm, title, warningText, lang = 'th' }) {
      const [step, setStep] = useState('pin'); // 'pin' | 'double_confirm'
      const [pin, setPin] = useState(['', '', '', '']);
      const [errorMsg, setErrorMsg] = useState('');
      const [isShaking, setIsShaking] = useState(false);

      useEffect(() => {
        if (isOpen) {
          setStep('pin');
          setPin(['', '', '', '']);
          setErrorMsg('');
          setIsShaking(false);
        }
      }, [isOpen]);

      // Physical Keyboard Listener
      useEffect(() => {
        if (!isOpen) return;

        const handleKeyDown = (e) => {
          if (step === 'pin') {
            if (e.key >= '0' && e.key <= '9') {
              const nextIdx = pin.findIndex(d => d === '');
              if (nextIdx !== -1) {
                const newPin = [...pin];
                newPin[nextIdx] = e.key;
                setPin(newPin);
                setErrorMsg('');
              }
            } else if (e.key === 'Backspace') {
              const lastFilledIdx = pin.map(d => d !== '').lastIndexOf(true);
              if (lastFilledIdx !== -1) {
                const newPin = [...pin];
                newPin[lastFilledIdx] = '';
                setPin(newPin);
                setErrorMsg('');
              }
            } else if (e.key === 'Enter') {
              if (pin.join('').length === 4) {
                handleAuthorizePIN();
              }
            } else if (e.key === 'Escape') {
              onClose();
            }
          } else if (step === 'double_confirm') {
            if (e.key === 'Enter') {
              handleFinalExecute();
            } else if (e.key === 'Escape') {
              onClose();
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, step, pin]);

      if (!isOpen) return null;

      const handleNumpadClick = (num) => {
        const nextIdx = pin.findIndex(d => d === '');
        if (nextIdx !== -1) {
          const newPin = [...pin];
          newPin[nextIdx] = num.toString();
          setPin(newPin);
          setErrorMsg('');
        }
      };

      const handleNumpadBackspace = () => {
        const lastFilledIdx = pin.map(d => d !== '').lastIndexOf(true);
        if (lastFilledIdx !== -1) {
          const newPin = [...pin];
          newPin[lastFilledIdx] = '';
          setPin(newPin);
          setErrorMsg('');
        }
      };

      const handleClear = () => {
        setPin(['', '', '', '']);
        setErrorMsg('');
      };

      // Step 1: Validate PIN -> Move to Step 2 (Double Confirmation)
      const handleAuthorizePIN = () => {
        const fullPin = pin.join('');
        if (fullPin === SECURITY_PIN) {
          setStep('double_confirm');
        } else {
          setIsShaking(true);
          setErrorMsg(lang === 'en' ? '❌ Incorrect security PIN. Please try again.' : '❌ รหัสผ่านความปลอดภัยไม่ถูกต้อง กรุณาลองใหม่อีกครั้งค่ะ');
          setTimeout(() => {
            setIsShaking(false);
            setPin(['', '', '', '']);
          }, 600);
        }
      };

      // Step 2: Final Confirmation Execution
      const handleFinalExecute = () => {
        onConfirm();
        onClose();
      };

      const numpadButtons = [
        { digit: '1', sub: ' ' },
        { digit: '2', sub: 'ABC' },
        { digit: '3', sub: 'DEF' },
        { digit: '4', sub: 'GHI' },
        { digit: '5', sub: 'JKL' },
        { digit: '6', sub: 'MNO' },
        { digit: '7', sub: 'PQRS' },
        { digit: '8', sub: 'TUV' },
        { digit: '9', sub: 'WXYZ' },
        { digit: 'C', sub: 'CLEAR', action: handleClear },
        { digit: '0', sub: '+' },
        { digit: '⌫', sub: 'BACK', action: handleNumpadBackspace }
      ];

      return (
        <div className="modal-overlay" style={{ zIndex: 3000 }} onClick={onClose}>
          <div 
            className="cyber-pin-modal" 
            style={{
              animation: isShaking ? 'shake 0.4s ease' : 'fadeIn 0.25s ease'
            }} 
            onClick={e => e.stopPropagation()}
          >
            {/* STEP 1: SECURITY PIN VERIFICATION */}
            {step === 'pin' && (
              <React.Fragment>
                {/* Pulsing Holographic Shield Header */}
                <div className="cyber-pin-shield-glow">
                  <Icon name="shield" size={26} color="var(--accent-rose)" />
                </div>

                <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: '#ffffff', marginBottom: 4, letterSpacing: '0.3px' }}>
                  {lang === 'en' ? 'Security Verification' : 'ยืนยันรหัสความปลอดภัย (ขั้นที่ 1/2)'}
                </h3>
                
                <p style={{ fontSize: '0.82rem', color: '#94a3b8', marginBottom: 10 }}>
                  {title || (lang === 'en' ? 'Enter 4-digit security PIN to authorize:' : 'กรุณาระบุรหัสผ่าน 4 หลักเพื่อยืนยันดำเนินการ:')}
                </p>

                {warningText && (
                  <div style={{
                    background: 'rgba(244, 63, 94, 0.12)', 
                    border: '1px solid rgba(244, 63, 94, 0.35)', 
                    padding: '7px 12px', 
                    borderRadius: 10, 
                    fontSize: '0.76rem', 
                    color: '#fda4af',
                    marginBottom: 12,
                    lineHeight: 1.35
                  }}>
                    ⚠️ {warningText}
                  </div>
                )}

                {/* Futuristic 4-Digit Indicator Slots */}
                <div className="cyber-pin-dots">
                  {[0, 1, 2, 3].map((idx) => {
                    const isFilled = pin[idx] !== '';
                    return (
                      <div key={idx} className={`cyber-pin-slot ${isFilled ? 'filled' : ''}`}>
                        {isFilled ? '●' : ''}
                      </div>
                    );
                  })}
                </div>

                {errorMsg && (
                  <div style={{ fontSize: '0.78rem', color: 'var(--accent-rose)', fontWeight: 700, margin: '6px 0 10px', minHeight: 18 }}>
                    {errorMsg}
                  </div>
                )}

                {/* Circular Cyber Numeric Keypad */}
                <div className="cyber-numpad-grid">
                  {numpadButtons.map((btn, idx) => {
                    const isAction = !!btn.action;
                    return (
                      <button
                        key={idx}
                        type="button"
                        className="cyber-num-btn"
                        onClick={() => {
                          if (btn.action) btn.action();
                          else handleNumpadClick(btn.digit);
                        }}
                      >
                        <span className="cyber-num-digit" style={{ fontSize: isAction ? '0.95rem' : '1.25rem', color: isAction ? '#94a3b8' : '#ffffff' }}>
                          {btn.digit}
                        </span>
                        <span className="cyber-num-sub">{btn.sub}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Bottom Controls */}
                <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 10 }}>
                  <button
                    type="button"
                    className="btn btn-secondary"
                    style={{ flex: 1, padding: '10px 14px', borderRadius: 12, fontSize: '0.88rem' }}
                    onClick={onClose}
                  >
                    {lang === 'en' ? 'Cancel' : 'ยกเลิก'}
                  </button>
                  <button
                    type="button"
                    className="btn btn-primary"
                    style={{
                      flex: 1.2, 
                      padding: '10px 16px', 
                      borderRadius: 12, 
                      background: pin.join('').length === 4 ? 'linear-gradient(135deg, #f43f5e, #e11d48)' : 'rgba(71, 85, 105, 0.4)',
                      fontWeight: 800,
                      fontSize: '0.88rem',
                      boxShadow: pin.join('').length === 4 ? '0 4px 15px rgba(244, 63, 94, 0.45)' : 'none',
                      cursor: pin.join('').length === 4 ? 'pointer' : 'not-allowed',
                      opacity: pin.join('').length === 4 ? 1 : 0.6
                    }}
                    disabled={pin.join('').length !== 4}
                    onClick={() => handleAuthorizePIN()}
                  >
                    {lang === 'en' ? 'Authorize ➔' : 'ยืนยันรหัสผ่าน ➔'}
                  </button>
                </div>
              </React.Fragment>
            )}

            {/* STEP 2: DOUBLE CONFIRMATION SAFETY SHIELD (ป็อปอัพยืนยันอีกครั้งเพื่อความแน่ใจ) */}
            {step === 'double_confirm' && (
              <div style={{ padding: '8px 4px', animation: 'fadeIn 0.25s ease' }}>
                <div style={{
                  width: 68,
                  height: 68,
                  borderRadius: '50%',
                  background: 'rgba(239, 68, 68, 0.18)',
                  border: '2px solid #ef4444',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  margin: '0 auto 16px',
                  boxShadow: '0 0 30px rgba(239, 68, 68, 0.5), inset 0 0 15px rgba(239, 68, 68, 0.3)',
                  animation: 'pulseGlow 1.8s infinite'
                }}>
                  <Icon name="trash" size={32} color="#ef4444" />
                </div>

                <div style={{
                  display: 'inline-block',
                  background: 'rgba(16, 185, 129, 0.15)',
                  color: '#34d399',
                  border: '1px solid rgba(16, 185, 129, 0.4)',
                  padding: '3px 12px',
                  borderRadius: 20,
                  fontSize: '0.75rem',
                  fontWeight: 700,
                  marginBottom: 10
                }}>
                  ✅ {lang === 'en' ? 'PIN Verified Successfully' : 'ยืนยันรหัสผ่านถูกต้องเรียบร้อย'}
                </div>

                <h3 style={{ fontSize: '1.25rem', fontWeight: 800, color: '#ffffff', marginBottom: 8, letterSpacing: '0.2px' }}>
                  {lang === 'en' ? '🚨 Final Confirmation' : '🚨 ยืนยันการดำเนินการขั้นสุดท้าย'}
                </h3>

                <p style={{ fontSize: '0.88rem', color: '#e2e8f0', fontWeight: 600, marginBottom: 14, lineHeight: 1.5 }}>
                  {lang === 'en' 
                    ? `Are you 100% sure you want to permanently execute this action?`
                    : `คุณแน่ใจ 100% หรือไม่ว่าต้องการดำเนินการนี้อย่างถาวร?`}
                </p>

                <div style={{
                  background: 'rgba(15, 23, 42, 0.8)',
                  border: '1.5px solid rgba(244, 63, 94, 0.5)',
                  padding: '12px 14px',
                  borderRadius: 14,
                  textAlign: 'left',
                  marginBottom: 18,
                  boxShadow: 'inset 0 2px 8px rgba(0,0,0,0.5)'
                }}>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: '#fda4af', marginBottom: 4 }}>
                    📌 {title || (lang === 'en' ? 'Permanent Action' : 'การลบข้อมูลถาวร')}
                  </div>
                  <div style={{ fontSize: '0.74rem', color: '#94a3b8', lineHeight: 1.4 }}>
                    ⚠️ {lang === 'en' 
                      ? 'All associated WBS tasks, actual cost entries, daily logs, and site photos will be PERMANENTLY REMOVED and cannot be recovered.'
                      : 'ข้อมูลงาน WBS, บันทึกต้นทุนจริง, รูปภาพ และบันทึกประจำวันทั้งหมดจะถูกลบถาวร และไม่สามารถกู้คืนได้อีกต่อไปค่ะ'}
                  </div>
                </div>

                <div style={{ display: 'flex', gap: 12 }}>
                  <button
                    type="button"
                    className="btn btn-secondary"
                    style={{ flex: 1, padding: '11px 16px', borderRadius: 12, fontSize: '0.9rem', fontWeight: 600 }}
                    onClick={onClose}
                  >
                    {lang === 'en' ? '❌ Cancel / Return' : '❌ ยกเลิก / ย้อนกลับ'}
                  </button>
                  <button
                    type="button"
                    className="btn btn-primary"
                    style={{
                      flex: 1.3,
                      padding: '11px 16px',
                      borderRadius: 12,
                      background: 'linear-gradient(135deg, #ef4444, #b91c1c)',
                      fontWeight: 800,
                      fontSize: '0.9rem',
                      boxShadow: '0 6px 20px rgba(239, 68, 68, 0.5)',
                      display: 'inline-flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: 6
                    }}
                    onClick={() => handleFinalExecute()}
                  >
                    <Icon name="trash" size={16} color="#ffffff" />
                    <span>{lang === 'en' ? 'Yes, Delete Permanently' : 'ยืนยันลบอย่างถาวร'}</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

        e.preventDefault();
        if (!fbAuth) {
          setAuthError(lang === 'en' ? 'Firebase Authentication not loaded' : 'ระบบ Firebase ยังไม่พร้อมใช้งาน');
          return;
        }
        if (!email.trim() || !password.trim()) {
          setAuthError(lang === 'en' ? 'Please enter both email and password.' : 'กรุณากรอกทั้งอีเมลและรหัสผ่านค่ะ');
          return;
        }

        setIsLoading(true);
        setAuthError('');

        try {
          const userCredential = await fbAuth.signInWithEmailAndPassword(email.trim(), password);
          onLoginSuccess(userCredential.user);
          onClose();
        } catch (err) {
          console.warn('Login error:', err);
          if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            setAuthError(lang === 'en' ? '❌ Invalid email or password. Please check your credentials.' : '❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้งค่ะ');
          } else if (err.code === 'auth/invalid-email') {
            setAuthError(lang === 'en' ? '❌ Invalid email address format.' : '❌ รูปแบบอีเมลไม่ถูกต้องค่ะ');
          } else {
            setAuthError('❌ ' + err.message);
          }
        } finally {
          setIsLoading(false);
        }

                        padding: '0 18px',

                      disabled={isLoading}
                    >
