                      ) : (

                          <span>{lang === 'en' ? 'Sign In' : 'เข้าสู่ระบบ'}</span>

            )}
          </div>
        </div>
      );
    }


    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'dark');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [lang, setLang] = useState(() => localStorage.getItem(LANG_KEY) || 'th');
      const [projects, setProjects] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved !== null) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              return parsed.filter(p => p != null && typeof p === 'object');
            }
          }
        } catch(e) {}
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProjects));
        } catch(e) {}
        return defaultProjects;
      });

      useEffect(() => {
        const timer = setTimeout(() => setIsLoading(false), 900);
        return () => clearTimeout(timer);
      }, []);

      const triggerLoading = (callback, duration = 500) => {
        setIsLoading(true);
        setTimeout(() => {
          if (callback) callback();
          setIsLoading(false);
        }, duration);
      };

      const [viewMode, setViewMode] = useState(() => localStorage.getItem('project_hub_view_mode') || 'table');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [selectedWarranty, setSelectedWarranty] = useState('All');

      const [selectedProject, setSelectedProject] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [isBackupOpen, setIsBackupOpen] = useState(false);
      const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
      const [isAICopilotOpen, setIsAICopilotOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [expandedGanttProjectId, setExpandedGanttProjectId] = useState(null);
      const [pinModalConfig, setPinModalConfig] = useState(null); // { title, warningText, onConfirm }
      const [currentUser, setCurrentUser] = useState(null);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [isCloudOnline, setIsCloudOnline] = useState(true);
      const [isAlertCenterOpen, setIsAlertCenterOpen] = useState(false);
      const [alertFilterTab, setAlertFilterTab] = useState('all');
      const [customRoles, setCustomRoles] = useState(() => {
        try {
          const saved = localStorage.getItem('project_hub_custom_roles');
          return saved ? JSON.parse(saved) : {};
        } catch(e) { return {}; }
      });

      // Synchronize Team Roles with Cloud Firestore
      useEffect(() => {
        if (fbDb) {
          const unsubRoles = fbDb.collection('app_config').doc('roles').onSnapshot(doc => {
            if (doc.exists) {
              setCustomRoles(doc.data() || {});
            }
          }, err => console.warn('Roles sync notice:', err));
          return () => unsubRoles();
        }
      }, []);

      const handleUpdateRole = (userEmail, newRole) => {
        const emailKey = userEmail.toLowerCase().trim();
        const updated = Object.assign({}, customRoles, { [emailKey]: newRole });
        setCustomRoles(updated);
        localStorage.setItem('project_hub_custom_roles', JSON.stringify(updated));
        if (fbDb) {
          fbDb.collection('app_config').doc('roles').set(updated, { merge: true });
        }
        showToast(lang === 'en' ? `Updated role for ${userEmail} to ${newRole}` : `อัปเดตสิทธิ์ของ ${userEmail} เป็น ${newRole} เรียบร้อยค่ะ`);
      };


      // 1. Listen to Firebase Auth State (Auto-Login Session)
      useEffect(() => {
        if (fbAuth) {
          const unsubscribe = fbAuth.onAuthStateChanged(user => {
            setCurrentUser(user);
          });
          return () => unsubscribe();
        }
      }, []);

      // 2. Real-Time Cloud Firestore Sync Listener (Instant Multi-Device Synchronization)
      useEffect(() => {
        const unsubscribe = CloudSyncService.subscribeProjects((cloudProjects) => {
          if (Array.isArray(cloudProjects)) {
            setProjects(cloudProjects);
            ProjectStorage.set(STORAGE_KEY, cloudProjects);
            setIsCloudOnline(true);
            setSelectedProject(prev => {
              if (!prev || !prev.id) return prev;
              const matched = cloudProjects.find(p => p.id === prev.id);
              return matched || prev;
            });
          }
        });
        return () => unsubscribe();
      }, []);
      

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(THEME_KEY, theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem(LANG_KEY, lang);
      }, [lang]);

      useEffect(() => {
        ProjectStorage.set(STORAGE_KEY, projects);
      }, [projects, theme]);

      useEffect(() => {
        localStorage.setItem('project_hub_view_mode', viewMode);
      }, [viewMode]);

      const t = (key) => translations[lang]?.[key] || translations['th']?.[key] || key;

      const toggleTheme = () => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleSaveProject = (projData) => {
        let updatedList;
        if (editingProject) {
          updatedList = projects.map(p => p.id === projData.id ? projData : p);
          if (selectedProject?.id === projData.id) setSelectedProject(projData);
          showToast(t('toastUpdateSuccess'));
        } else {
          updatedList = [projData, ...projects];
          showToast(t('toastCreateSuccess'));
        }
        setProjects(updatedList);
        ProjectStorage.set(STORAGE_KEY, updatedList);
        CloudSyncService.saveProject(projData, currentUser ? currentUser.email : 'Team Member');
        if (Array.isArray(projData.documents)) {
          projData.documents.forEach(doc => {
            if (doc && doc.id && doc.dataUrl) {
              CloudSyncService.saveDocument(projData.id, doc);
            }
          });
        }
        setIsFormOpen(false);
        setEditingProject(null);
      };

      const handleDeleteProject = (id) => {
        const targetProj = projects.find(p => p.id === id);
        const projName = targetProj ? `[${targetProj.code || 'PRJ'}] ${targetProj.title}` : '';
        setPinModalConfig({
          title: lang === 'en' ? `Delete project: ${projName}` : `ลบโครงการ: ${projName}`,
          warningText: lang === 'en' ? 'This action is permanent and will remove all project tasks, expenses, and photos.' : 'การลบนี้จะไม่สามารถกู้คืนได้ และจะลบงาน WBS, บันทึกต้นทุน และรูปภาพทั้งหมดในโครงการค่ะ',
          onConfirm: () => {
            const updated = projects.filter(p => p.id !== id);
            setProjects(updated);
            ProjectStorage.set(STORAGE_KEY, updated);
            if (selectedProject?.id === id) setSelectedProject(null);
            showToast(t('toastDeleteSuccess'));
            CloudSyncService.deleteProject(id);
          }
        });
      };

      const handleUpdateSingleProject = (updated) => {
        setProjects(prevProjects => prevProjects.map(p => p.id === updated.id ? updated : p));
        setSelectedProject(prevSelected => prevSelected ? updated : null);
        showToast(t('toastDatesSaved'));
        CloudSyncService.saveProject(updated, currentUser ? currentUser.email : 'Team Member');
        if (Array.isArray(updated.documents)) {
          updated.documents.forEach(doc => {
            if (doc && doc.id && doc.dataUrl) {
              CloudSyncService.saveDocument(updated.id, doc);
            }
          });
        }
      };

      // Export Executive Summary to Excel (.csv with UTF-8 BOM) matching exact column structure requested by user
      const handleExportExcel = () => {
        let csvContent = "\uFEFF"; // UTF-8 BOM for Excel Thai language support
        
        // Comprehensive 30 headers containing all project data including EVM & Milestones
        const headers = [
          "Item no.",
          "Project Code",
          "Status",
          "Progress (%)",
          "Client",
          "Location",
          "Project Title",
          "Description",
          "Budget (THB)",
          "Cost Plan (THB)",
          "Actual Cost (THB)",
          "Remaining Budget (THB)",
          "EVM SPI (Schedule Index)",
          "EVM CPI (Cost Index)",
          "EVM EAC (Forecast Cost THB)",
          "EVM Health",
          "Milestones Billed (THB)",
          "Milestones Paid (THB)",
          "Milestones Status",
          "Seller",
          "Owner/PM",
          "Contractor",
          "Start Date",
          "Target Date",
          "Warranty period",
          "Warranty status",
          "Warranty start date",
          "Tasks Completed / Total",
          "Expense Items Count",
          "Daily Logs Count",
          "Google Map URL"
        ];
        
        csvContent += headers.join(",") + "\n";
        
        projects.forEach((p, idx) => {
          const itemNo = idx + 1;
          const code = `"${(p.code || '').replace(/"/g, '""')}"`;
          const status = `"${(p.status || '').replace(/"/g, '""')}"`;
          const progress = `"${p.progress || 0}%"`;
          const client = `"${(p.client || '').replace(/"/g, '""')}"`;
          const location = `"${(p.location || '').replace(/"/g, '""')}"`;
          const title = `"${(p.title || '').replace(/"/g, '""')}"`;
          const description = `"${(p.description || '').replace(/"/g, '""')}"`;
          const budget = `"${(p.budget || '').replace(/"/g, '""')}"`;
          const costPlan = `"${(p.costPlan || '').replace(/"/g, '""')}"`;

          // Exact Actual Cost & Remaining Budget calculation
          let actualAmt = 0;
          if (p.expenses && Array.isArray(p.expenses) && p.expenses.length > 0) {
            actualAmt = p.expenses.reduce((sum, exp) => sum + (parseFloat(exp.amount) || 0), 0);
          } else {
            actualAmt = parseFloat((p.actualCost || p.costSpent || 0).toString().replace(/,/g, '').replace(/[^0-9.]/g, '')) || 0;
          }
          const actualCostStr = `"${actualAmt > 0 ? actualAmt.toLocaleString('en-US') + ' บาท' : '0 บาท'}"`;

          const planNum = parseFloat((p.costPlan || 0).toString().replace(/,/g, '').replace(/[^0-9.]/g, '')) || 0;
          const remNum = planNum - actualAmt;
          const remainingBudgetStr = `"${remNum.toLocaleString('en-US')} บาท"`;

          // EVM Metrics
          const evm = calculateEVM(p);
          const evmSpi = `"${evm.spi}"`;
          const evmCpi = `"${evm.cpi}"`;
          const evmEac = `"${evm.eac.toLocaleString('en-US')} บาท"`;
          const evmHealth = `"${evm.health}"`;

          // Milestones Summary
          const mList = p.milestones || [];
          const mBilled = mList.filter(m => m.status === 'invoiced' || m.status === 'paid').reduce((s, m) => s + parseNumber(m.amount || 0), 0);
          const mPaid = mList.filter(m => m.status === 'paid').reduce((s, m) => s + parseNumber(m.amount || 0), 0);
          const mBilledStr = `"${mBilled.toLocaleString('en-US')} บาท"`;
          const mPaidStr = `"${mPaid.toLocaleString('en-US')} บาท"`;
          const mSummaryStr = `"${mList.filter(m=>m.status==='paid').length}/${mList.length} Milestones Paid"`;

          const seller = `"${(p.seller || '').replace(/"/g, '""')}"`;
          const owner = `"${(p.owner || '').replace(/"/g, '""')}"`;
          const contractor = `"${(p.contractor || '').replace(/"/g, '""')}"`;
          const startDate = `"${(p.startDate || '').replace(/"/g, '""')}"`;
          const targetDate = `"${(p.targetDate || '').replace(/"/g, '""')}"`;
          
          const warrantyPeriod = p.hasWarranty === 'yes' ? `"${p.warrantyYears || 0} Years"` : '"No Warranty"';
          const warrantyStatus = `"${getWarrantyStatus(p)}"`;
          const warrantyStartDate = `"${(p.warrantyStartDate || '').replace(/"/g, '""')}"`;

          const taskCount = (p.tasks || []).length;
          const taskDone = (p.tasks || []).filter(t => t.completed).length;
          const tasksSummary = `"${taskDone}/${taskCount} Tasks"`;

          const expensesCount = `"${(p.expenses || []).length} Items"`;
          const logsCount = `"${(p.logs || []).length} Logs"`;
          const mapUrl = `"${(p.googleMap || '').replace(/"/g, '""')}"`;
          
          csvContent += `${itemNo},${code},${status},${progress},${client},${location},${title},${description},${budget},${costPlan},${actualCostStr},${remainingBudgetStr},${evmSpi},${evmCpi},${evmEac},${evmHealth},${mBilledStr},${mPaidStr},${mSummaryStr},${seller},${owner},${contractor},${startDate},${targetDate},${warrantyPeriod},${warrantyStatus},${warrantyStartDate},${tasksSummary},${expensesCount},${logsCount},${mapUrl}\n`;
        });
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        const dateStr = new Date().toISOString().slice(0,10);
        link.setAttribute('download', `Project_Comprehensive_Report_${dateStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast(lang === 'en' ? 'Comprehensive Excel report exported successfully' : 'ส่งออกไฟล์ Excel ข้อมูลครบถ้วนทุกหัวข้อเรียบร้อยแล้ว');
      };

      const handlePrintExecutiveReport = () => {
        setIsPrintModalOpen(true);
      };

      // Helper to calculate Warranty Status
      const getWarrantyStatus = (p) => {
        if (p.hasWarranty === 'no') return 'No-Warranty';
        if (!p.warrantyStartDate || !p.warrantyYears) return 'In-Warranty';
        const start = new Date(p.warrantyStartDate);
        if (isNaN(start.getTime())) return 'In-Warranty';
        const end = new Date(start);
        end.setFullYear(end.getFullYear() + Number(p.warrantyYears));
        const today = new Date();
        return today <= end ? 'In-Warranty' : 'Out-Warranty';
      };

      const filteredProjects = projects.filter(p => {
        const query = searchQuery.toLowerCase();
        const matchesSearch = (p.title || '').toLowerCase().includes(query) ||
                               (p.code || '').toLowerCase().includes(query) ||
                               (p.owner || '').toLowerCase().includes(query) ||
                               (p.seller || '').toLowerCase().includes(query) ||
                               (p.contractor || '').toLowerCase().includes(query) ||
                               (p.client || '').toLowerCase().includes(query) ||
                               (p.description || '').toLowerCase().includes(query);

        const matchesStatus = selectedStatus === 'All' || p.status === selectedStatus;
        const pWarranty = getWarrantyStatus(p);
        const matchesWarranty = selectedWarranty === 'All' || pWarranty === selectedWarranty;

        return matchesSearch && matchesStatus && matchesWarranty;
      });

      // Calculate Metrics

          {/* PROJECT DETAIL MODAL WITH RBAC & READ-ONLY PROTECTIONS */}
          {selectedProject && (
            <ProjectDetailModal 
              project={selectedProject} 
              canEdit={canEditProject(selectedProject, currentUser, customRoles)}
              currentUser={currentUser}
              onRequireLogin={() => {
                showToast(lang === 'en' ? '🔒 Please sign in to edit or modify project tasks.' : '🔒 กรุณาเข้าสู่ระบบก่อนแก้ไขงานในโครงการค่ะ');
                setIsAuthModalOpen(true);
              }}
              onClose={() => setSelectedProject(null)}
              onUpdate={handleUpdateSingleProject}
              onEditProject={(proj) => {
                if (!canEditProject(proj, currentUser, customRoles)) {
                  showToast(lang === 'en' ? '🔒 You do not have permission to edit this project.' : '🔒 คุณไม่มีสิทธิ์แก้ไขโครงการนี้ค่ะ');
                  return;
                }
                setSelectedProject(null);
                setEditingProject(proj);
                setIsFormOpen(true);
              }}
              onDeleteProject={(id) => {
                if (!canDeleteProject(selectedProject, currentUser, customRoles)) {
                  showToast(lang === 'en' ? '🔒 Only Super Admins can delete projects.' : '🔒 เฉพาะ Super Admin เท่านั้นที่สามารถลบโครงการได้ค่ะ');
                  return;
                }
                handleDeleteProject(id);
              }}
              lang={lang}
            />

              onClose={() => { setIsFormOpen(false); setEditingProject(null); }}

              lang={lang}
            />

              onClose={() => setIsBackupOpen(false)}

              lang={lang}
            />

          {isPrintModalOpen && (
            <ExecutivePrintReportModal 
              projects={filteredProjects.length > 0 ? filteredProjects : projects} 
              lang={lang} 
              onClose={() => setIsPrintModalOpen(false)} 
            />

          <AICopilotWidget 
            projects={projects} 
            lang={lang} 
            isOpen={isAICopilotOpen} 
            setIsOpen={setIsAICopilotOpen} 
          />

          {/* TOAST */}

          
          
          {/* 🔒 SECURITY PIN VERIFICATION MODAL (2332) */}
          <AuthModal 
            isOpen={isAuthModalOpen}
            customRoles={customRoles}
            onUpdateRole={handleUpdateRole}
            onClose={() => setIsAuthModalOpen(false)}
            currentUser={currentUser}
            onLoginSuccess={(user) => {
              setCurrentUser(user);
              showToast(user ? (lang === 'en' ? `Welcome back, ${user.email}!` : `ยินดีต้อนรับคุณ ${user.email} เข้าสู่ระบบค่ะ!`) : (lang === 'en' ? 'Logged out successfully' : 'ออกจากระบบเรียบร้อยแล้วค่ะ'));
            }}
            lang={lang}
          />

            isOpen={pinModalConfig !== null}
            onClose={() => setPinModalConfig(null)}
            onConfirm={pinModalConfig ? pinModalConfig.onConfirm : () => {}}
            title={pinModalConfig ? pinModalConfig.title : ''}
            warningText={pinModalConfig ? pinModalConfig.warningText : ''}
            lang={lang}
          />

          {toastMsg && <div className="toast">{toastMsg}</div>}
        </div>
      );
    }

    function StatusBadge({ status, lang = 'th' }) {
      const t = (key) => translations[lang]?.[key] || translations['th']?.[key] || key;
      switch (status) {
        case 'draft': return <span className="badge badge-draft">📝 {lang === 'en' ? 'Draft' : 'Draft (ร่าง)'}</span>;
        case 'planning': return <span className="badge badge-planning">📋 {t('statusPlanning')}</span>;
        case 'in-progress': return <span className="badge badge-in-progress">⚡ {t('statusInProgress')}</span>;
        case 'completed': return <span className="badge badge-completed">✅ {t('statusCompleted')}</span>;
        case 'on-hold': return <span className="badge badge-on-hold">⏸️ {t('statusOnHold')}</span>;

        default: return <span className="badge">{status}</span>;
      }
    }

    const THAI_ADDRESS_DATA = THAI_PROVINCES_DATA;
    const THAI_POSTAL_MAP = THAI_ZIPCODE_LOOKUP;

    // SMART THAI ADDRESS PARSER HELPER
    // Automatically extracts { zipcode, province, amphoe, tambon, addressDetail }
    // Handles Google Maps format: "RW26+2MQ ตำบล ช่องสาริกา อำเภอพัฒนานิคม ลพบุรี 15220"
    // and short Plus Code format: "M8HC+GV6 ระยอง ไทย"
    function parseThaiAddressString(rawStr) {
      if (!rawStr || typeof rawStr !== 'string') return null;
      let text = rawStr.trim();
      let zipcode = '';
      let province = '';
      let amphoe = '';
      let tambon = '';

      // 1. Extract 5-digit zipcode
      const zipMatch = text.match(/\b(\d{5})\b/);
      if (zipMatch) {
        zipcode = zipMatch[1];
        text = text.replace(zipMatch[0], ' ');
      }

      // 2. Extract Sub-district (ตำบล / แขวง / ต.)
      const tambonMatch = text.match(/(?:ตำบล|แขวง|ต\.)\s*([^\s,]+)/);
      if (tambonMatch) {
        tambon = tambonMatch[1].trim();
        text = text.replace(tambonMatch[0], ' ');
      }

      // 3. Extract District (อำเภอ / เขต / อ.)
      const amphoeMatch = text.match(/(?:อำเภอ|เขต|อ\.)\s*([^\s,]+)/);
      if (amphoeMatch) {
        amphoe = amphoeMatch[1].trim();
        text = text.replace(amphoeMatch[0], ' ');
      }

      // 4. Extract Province (จังหวัด / จ. or direct name match against 77 provinces)
      const provMatch = text.match(/(?:จังหวัด|จ\.)\s*([^\s,]+)/);
      if (provMatch) {
        province = provMatch[1].trim();
        text = text.replace(provMatch[0], ' ');
      } else {
        for (const pr of THAI_ADDRESS_DATA) {
          if (text.includes(pr.name) || (pr.nameEn && text.toLowerCase().includes(pr.nameEn.toLowerCase()))) {
            province = pr.name;
            text = text.replace(pr.name, ' ');
            if (pr.nameEn) text = text.replace(new RegExp(pr.nameEn, 'i'), ' ');
            break;
          }
        }
      }

      // 5. Cross-check / Auto-fill from THAI_POSTAL_MAP if zipcode was found
      if (zipcode && THAI_POSTAL_MAP[zipcode]) {
        const zipInfo = THAI_POSTAL_MAP[zipcode];
        if (!province) province = zipInfo.p;
        if (!amphoe) amphoe = zipInfo.a;
        if (!tambon && zipInfo.t && zipInfo.t.length === 1) {
          tambon = zipInfo.t[0];
        }
      }

      // 6. If province is found and district is missing, check if any district in this province is mentioned
      if (province && !amphoe) {
        const provObj = THAI_ADDRESS_DATA.find(p => p.name === province || p.nameEn === province);
        if (provObj && provObj.amphoes) {
          for (const a of provObj.amphoes) {
            if (text.includes(a.name) || (a.nameEn && text.toLowerCase().includes(a.nameEn.toLowerCase()))) {
              amphoe = a.name;
              text = text.replace(a.name, ' ');
              if (a.nameEn) text = text.replace(new RegExp(a.nameEn, 'i'), ' ');
              break;
            }
          }
        }
      }

      // 7. Clean up remaining text for addressDetail / Plus Code
      let addressDetail = text.replace(/\b(ไทย|thailand)\b/gi, ' ').replace(/\s+/g, ' ').trim();

      return {
        zipcode,
        province,
        amphoe,
        tambon,
        addressDetail
      };
    }

      const handleSmartAddressPaste = (rawText) => {
        setSmartAddressInput(rawText);
        const parsed = parseThaiAddressString(rawText);
        if (parsed) {
          if (parsed.province) {
            const pObj = THAI_ADDRESS_DATA.find(p => p.name === parsed.province || (p.nameEn && p.nameEn.toLowerCase() === parsed.province.toLowerCase()));
            const provName = pObj ? pObj.name : parsed.province;
            setSelectedProvince(provName);

            if (parsed.amphoe && pObj && pObj.amphoes) {
              const aObj = pObj.amphoes.find(a => a.name === parsed.amphoe || (a.nameEn && a.nameEn.toLowerCase() === parsed.amphoe.toLowerCase()));
              setSelectedAmphoe(aObj ? aObj.name : parsed.amphoe);
            } else if (parsed.amphoe) {
              setSelectedAmphoe(parsed.amphoe);
            }
          }
          if (parsed.tambon) setSelectedTambon(parsed.tambon);
          if (parsed.zipcode) setZipcode(parsed.zipcode);
          if (parsed.addressDetail) setAddressDetail(parsed.addressDetail);
        }
      };

      // Smart Address Detail Input Handler (Auto-extracts if user pastes Plus Code / Province / Zip into manual field)
      const handleAddressDetailChange = (val) => {
        setAddressDetail(val);
        if (val && (val.includes('+') || val.includes(' ') || /\d{5}/.test(val))) {
          const parsed = parseThaiAddressString(val);
          if (parsed) {
            if (parsed.province && !selectedProvince) {
              const pObj = THAI_ADDRESS_DATA.find(p => p.name === parsed.province || (p.nameEn && p.nameEn.toLowerCase() === parsed.province.toLowerCase()));
              setSelectedProvince(pObj ? pObj.name : parsed.province);
            }
            if (parsed.amphoe && !selectedAmphoe) setSelectedAmphoe(parsed.amphoe);
            if (parsed.tambon && !selectedTambon) setSelectedTambon(parsed.tambon);
            if (parsed.zipcode && !zipcode) setZipcode(parsed.zipcode);
          }
        }
      };

      // Synthesize full location string whenever address fields change
      useEffect(() => {
        const parts = [
          addressDetail.trim(),
          selectedTambon ? 'ต.' + selectedTambon : '',
          selectedAmphoe ? 'อ.' + selectedAmphoe : '',
          selectedProvince ? 'จ.' + selectedProvince : '',
          zipcode.trim()
        ].filter(Boolean);

        if (parts.length > 0) {
          setLocation(parts.join(' '));
        }
      }, [addressDetail, selectedTambon, selectedAmphoe, selectedProvince, zipcode]);
      const [googleMap, setGoogleMap] = useState(project?.googleMap || '');
      const [status, setStatus] = useState(project?.status || 'in-progress');
      const [startDate, setStartDate] = useState(project?.startDate || '');
      const [targetDate, setTargetDate] = useState(project?.targetDate || '');
      const [description, setDescription] = useState(project?.description || '');
      const [progress, setProgress] = useState(project?.progress || 0);

      // Warranty Fields
      const [hasWarranty, setHasWarranty] = useState(project?.hasWarranty || 'yes');
      const [warrantyYears, setWarrantyYears] = useState(project?.warrantyYears || 1);
      const [warrantyStartDate, setWarrantyStartDate] = useState(project?.warrantyStartDate || '');

      // Attached Documents State
      const [documents, setDocuments] = useState(project?.documents || []);

      // Draft & Dirty state
      const [isFormTouched, setIsFormTouched] = useState(false);
      const [hasDraft, setHasDraft] = useState(() => !project && !!localStorage.getItem(DRAFT_KEY));

      // Auto-save draft for NEW project creation
      useEffect(() => {
        if (!project && isFormTouched) {
          const draftData = {
            title, code, owner, seller, contractor, client, budget, costPlan,
            location, googleMap, status, startDate, targetDate, description,
            progress, hasWarranty, warrantyYears, warrantyStartDate
          };
          localStorage.setItem(DRAFT_KEY, JSON.stringify(draftData));
        }
      }, [title, code, owner, seller, contractor, client, budget, costPlan, location, googleMap, status, startDate, targetDate, description, progress, hasWarranty, warrantyYears, warrantyStartDate, isFormTouched, project]);

      // Restore Draft
      const handleRestoreDraft = () => {
        try {
          const savedDraft = JSON.parse(localStorage.getItem(DRAFT_KEY));
          if (savedDraft) {
            setTitle(savedDraft.title || '');
            setCode(savedDraft.code || '');
            setOwner(savedDraft.owner || '');
            setSeller(savedDraft.seller || '');
            setContractor(savedDraft.contractor || '');
            setClient(savedDraft.client || '');
            setBudget(savedDraft.budget || '');
            setCostPlan(savedDraft.costPlan || '');
            setLocation(savedDraft.location || '');
            setGoogleMap(savedDraft.googleMap || '');
            setStatus(savedDraft.status || 'in-progress');
            setStartDate(savedDraft.startDate || '');
            setTargetDate(savedDraft.targetDate || '');
            setDescription(savedDraft.description || '');
            setProgress(savedDraft.progress || 0);
            setHasWarranty(savedDraft.hasWarranty || 'yes');
            setWarrantyYears(savedDraft.warrantyYears || 1);
            setWarrantyStartDate(savedDraft.warrantyStartDate || '');
            setHasDraft(false);
          }
        } catch (e) {}
      };

      const handleClearDraft = () => {
        localStorage.removeItem(DRAFT_KEY);
        setHasDraft(false);
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        setIsFormTouched(true);

        files.forEach(file => {
          if (file.size > 850 * 1024) {
            alert(lang === 'en' 
              ? `⚠️ File "${file.name}" is ${(file.size / (1024 * 1024)).toFixed(2)} MB.\nCloud sub-collection quota limit is 850 KB per document. Please compress or optimize the file.`
              : `⚠️ ไฟล์ "${file.name}" มีขนาด ${(file.size / (1024 * 1024)).toFixed(2)} MB\nโควตาคลาวด์ Sub-Collection กำหนดไว้ไม่เกิน 850 KB ต่อเอกสาร (กรุณาย่อขนาดหรือบีบอัดไฟล์ก่อนแนบค่ะ)`);
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            const newDoc = {
              id: 'doc-' + Date.now() + Math.random().toString(36).substr(2, 4),
              name: file.name,
              size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
              date: new Date().toISOString().slice(0, 10),
              dataUrl: event.target.result
            };
            setDocuments(prev => [...prev, newDoc]);
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveDocument = (docId) => {
        if (confirm(t('confirmDeleteDoc'))) {
          setIsFormTouched(true);
          setDocuments(documents.filter(d => d.id !== docId));
        }
      };

      // SAFE CLOSE WITH CONFIRMATION PROMPT
      const handleSafeClose = () => {
        const hasContent = title || code || owner || seller || contractor || client || budget || costPlan || description || documents.length > 0;
        if (isFormTouched || hasContent) {
          const confirmExit = confirm(lang === 'en' ? '⚠️ You have unsaved changes in the form.\n\nAre you sure you want to close?' : '⚠️ คุณมีข้อมูลที่กรอกค้างไว้ในฟอร์ม\n\nหากปิดหน้าต่างนี้ ข้อมูลที่กำลังกรอกอยู่จะสูญหาย ยืนยันที่จะปิดหน้าต่างนี้หรือไม่?');
          if (!confirmExit) return;
        }
        if (!project) localStorage.removeItem(DRAFT_KEY);
        onClose();
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        onSave({
          ...project,
          id: project ? project.id : 'proj-' + Date.now(),
          title: title.trim(),
          code: code.trim(),
          owner: owner.trim(),
          seller: seller.trim(),
          contractor: contractor.trim(),
          client: client.trim(),
          budget: budget.trim(),
          costPlan: costPlan.trim(),
          location: location.trim(),
          province: selectedProvince || '',
          zipcode: zipcode.trim(),
          amphoe: selectedAmphoe || '',
          tambon: selectedTambon || '',
          addressDetail: addressDetail.trim(),
          googleMap: googleMap.trim(),
          status,
          startDate,
          targetDate,
          description: description.trim(),
          progress: Number(progress),
          hasWarranty,
          warrantyYears: Number(warrantyYears),
          warrantyStartDate,
          documents,
          milestones: project?.milestones || [],
          tasks: project?.tasks || [],
          logs: project?.logs || [],
          expenses: project?.expenses || [],
          actualCost: project?.actualCost || '0',
          images: project?.images || []
        });

        if (!project) localStorage.removeItem(DRAFT_KEY);
      };

      return (
        <div className="modal-overlay">
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">{project ? t('formTitleEdit') : t('formTitleCreate')}</div>
                <div className="modal-subtitle">{lang === 'en' ? 'Fill project details, contract, attachments and warranty' : 'กรอกรายละเอียดข้อมูลโปรเจกต์ สัญญา เอกสารแนบ และการรับประกัน'}</div>
              </div>
              <button type="button" className="btn-icon" onClick={handleSafeClose} title={t('btnCancel')}>
                <Icon name="x" size={20} />
              </button>
            </div>

            {hasDraft && (
              <div style={{background:'var(--primary-light)', padding:'10px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid var(--border-color)', fontSize:'0.85rem'}}>
                <span>{lang === 'en' ? '💡 Found saved draft from earlier. Do you want to restore it?' : '💡 พบข้อมูลร่างที่คุณเคยกรอกค้างไว้ล่าสุด ต้องการกู้คืนหรือไม่?'}</span>
                <div style={{display:'flex', gap:8}}>
                  <button type="button" className="btn btn-primary" style={{padding:'4px 10px', fontSize:'0.75rem'}} onClick={handleRestoreDraft}>{lang === 'en' ? 'Restore Draft' : 'กู้คืนข้อมูลร่าง'}</button>
                  <button type="button" className="btn btn-secondary" style={{padding:'4px 10px', fontSize:'0.75rem'}} onClick={handleClearDraft}>{lang === 'en' ? 'Discard' : 'ล้างออก'}</button>
                </div>
              </div>
            )}

            <form onSubmit={handleSubmit} className="modal-body" onChange={() => setIsFormTouched(true)}>
              {/* Row 1: Project Name, Code, Owner */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formProjectTitle')} *</label>
                  <input type="text" className="form-input" placeholder={t('formProjectTitle')} value={title} onChange={e=>setTitle(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formProjectCode')}</label>
                  <input type="text" className="form-input" placeholder={t('formProjectCode')} value={code} onChange={e=>setCode(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formOwner')}</label>
                  <input type="text" className="form-input" placeholder={t('formOwner')} value={owner} onChange={e=>setOwner(e.target.value)} />
                </div>
              </div>

              {/* Row 2: Seller, Contractor, Client */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formSeller')}</label>
                  <input type="text" className="form-input" placeholder={t('formSeller')} value={seller} onChange={e=>setSeller(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formContractor')}</label>
                  <input type="text" className="form-input" placeholder={t('formContractor')} value={contractor} onChange={e=>setContractor(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formClient')}</label>
                  <input type="text" className="form-input" placeholder={t('formClient')} value={client} onChange={e=>setClient(e.target.value)} />
                </div>
              </div>

                            {/* Row 3: Budget, Planned Cost */}
              <div className="form-grid-2">
                <div className="form-group">
                  <label className="form-label">{t('formBudget')}</label>
                  <input type="text" className="form-input" placeholder={t('formBudget')} value={budget} onChange={e=>setBudget(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formCostPlan')}</label>
                  <input type="text" className="form-input" placeholder={t('formCostPlan')} value={costPlan} onChange={e=>setCostPlan(e.target.value)} />
                </div>
              </div>

              {/* FULL-WIDTH CASCADING THAI ADDRESS SECTION (BILINGUAL I18N SUPPORT) */}
              <div style={{marginTop:16, marginBottom:16, padding:16, background:'var(--bg-input)', borderRadius:12, border:'1px solid var(--border-color)', width:'100%'}}>
                <div style={{fontSize:'0.85rem', fontWeight:800, color:'var(--accent-cyan)', marginBottom:12, display:'flex', alignItems:'center', gap:6}}>
                  <Icon name="mapPin" size={16} />
                  <span>{lang === 'en' ? 'Project Location & Geographic Address' : 'สถานที่ตั้งและที่อยู่โครงการ (Cascading Address)'}</span>
                </div>

                {/* SMART ADDRESS AUTO-PARSE BAR */}
                <div style={{
                  marginBottom: 14, 
                  background: 'rgba(6, 182, 212, 0.08)', 
                  border: '1px dashed rgba(6, 182, 212, 0.4)', 
                  borderRadius: 10, 
                  padding: '10px 14px'
                }}>
                  <div style={{fontSize:'0.75rem', fontWeight:700, color:'var(--accent-cyan)', marginBottom:6, display:'flex', alignItems:'center', gap:6}}>
                    <span>✨</span>
                    <span>{lang === 'en' ? 'Smart Address Auto-Parser (Paste Google Maps / Full Address to Auto-fill all fields)' : 'ระบบแยกที่อยู่อัจฉริยะ (วางที่อยู่เต็มจาก Google Maps หรือเอกสารสัญญาเพื่อแยกช่องอัตโนมัติ)'}</span>
                  </div>
                  <div style={{display:'flex', gap:8}}>
                    <input 
                      type="text" 
                      className="form-input" 
                      style={{fontSize:'0.82rem', borderColor:'rgba(6, 182, 212, 0.3)'}}
                      placeholder={lang === 'en' ? 'e.g. RW26+2MQ ตำบล ช่องสาริกา อำเภอพัฒนานิคม ลพบุรี 15220' : 'เช่น RW26+2MQ ตำบล ช่องสาริกา อำเภอพัฒนานิคม ลพบุรี 15220'} 
                      value={smartAddressInput}
                      onChange={e => handleSmartAddressPaste(e.target.value)}
                    />
                    {smartAddressInput && (
                      <button 
                        type="button" 
                        className="btn-secondary" 
                        style={{padding:'6px 12px', fontSize:'0.75rem', whiteSpace:'nowrap'}}
                        onClick={() => {
                          setSmartAddressInput('');
                        }}
                      >
                        {lang === 'en' ? 'Clear' : 'ล้าง'}
                      </button>
                    )}
                  </div>
                </div>

                {/* Top Row: 4 Columns (Zipcode, Province, District, Sub-district) */}
                <div className="form-grid-4" style={{marginBottom:12}}>
                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'Postal Code' : 'รหัสไปรษณีย์'}</label>
                    <input 
                      type="text" 
                      className="form-input" 
                      placeholder="15220, 10110, 50000" 
                      maxLength={5} 
                      value={zipcode} 
                      onChange={e => handleZipcodeChange(e.target.value)} 
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'Province' : 'จังหวัด'}</label>
                    <select className="form-select" value={selectedProvince} onChange={e => handleProvinceChange(e.target.value)}>
                      <option value="">{lang === 'en' ? '-- Select Province --' : '-- เลือกจังหวัด --'}</option>
                      {THAI_ADDRESS_DATA.map(p => (
                        <option key={p.name} value={p.name}>
                          {lang === 'en' ? (p.nameEn || p.name) : p.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'District / Amphoe' : 'อำเภอ/เขต'}</label>
                    <select className="form-select" value={selectedAmphoe} onChange={e => handleAmphoeChange(e.target.value)} disabled={!selectedProvince}>
                      <option value="">{lang === 'en' ? '-- Select District --' : '-- เลือกอำเภอ/เขต --'}</option>
                      {availableAmphoes.map(a => (
                        <option key={a.name} value={a.name}>
                          {lang === 'en' ? (a.nameEn || a.name) : a.name}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="form-group">
                    <label className="form-label">{lang === 'en' ? 'Sub-District / Tambon' : 'ตำบล/แขวง'}</label>
                    <select className="form-select" value={selectedTambon} onChange={e => handleTambonChange(e.target.value)} disabled={!selectedAmphoe && availableTambons.length === 0}>
                      <option value="">{lang === 'en' ? '-- Select Sub-District --' : '-- เลือกตำบล/แขวง --'}</option>
                      {availableTambons.map(t => (
                        <option key={t.name} value={t.name}>
                          {lang === 'en' ? (t.nameEn || t.name) : t.name}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Bottom Row: Full Width Address Detail */}
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label">{lang === 'en' ? 'Address Detail / Substation Site (Manual Line)' : 'รายละเอียดที่อยู่/ถนน/พื้นที่โครงการ (กรอกมือ)'}</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder={lang === 'en' ? 'e.g. 123 Sukhumvit Rd, Substation Site A' : 'เช่น 123 ถ.สุขุมวิท, พื้นที่สถานีไฟฟ้าแรงสูง A'} 
                    value={addressDetail} 
                    onChange={e => handleAddressDetailChange(e.target.value)} 
                  />
                </div>
              </div>{/* Row 4: Google Map, Project status, Start date */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formGoogleMap')}</label>
                  <input type="url" className="form-input" placeholder={t('formGoogleMap')} value={googleMap} onChange={e=>setGoogleMap(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formStatus')}</label>
                  <select className="form-select" value={status} onChange={e=>setStatus(e.target.value)}>
                    <option value="draft">📝 Draft ({lang === 'en' ? 'Draft' : 'ร่าง'})</option>
                    <option value="planning">📋 {t('statusPlanning')}</option>
                    <option value="in-progress">⚡ {t('statusInProgress')}</option>
                    <option value="completed">✅ {t('statusCompleted')}</option>
                    <option value="on-hold">⏸️ {t('statusOnHold')}</option>
                    <option value="cancel">🚫 Cancel ({lang === 'en' ? 'Cancel' : 'ยกเลิก'})</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">{t('formStartDate')}</label>
                  <input type="date" className="form-input" value={startDate} onChange={e=>setStartDate(e.target.value)} />
                </div>
              </div>

              {/* Row 5: End date */}
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('formTargetDate')}</label>
                  <input type="date" className="form-input" value={targetDate} onChange={e=>setTargetDate(e.target.value)} />
                </div>
              </div>

              {/* Row 5: Progress % */}
              <div className="form-group" style={{marginBottom:16}}>
                <label className="form-label">{t('formProgress')} ({progress}%)</label>
                <input type="range" min="0" max="100" value={progress} onChange={e=>setProgress(e.target.value)} style={{marginTop:8}} />
              </div>

              {/* Row 5: WARRANTY SECTION */}
              <div className="section-title">
                <Icon name="shield" size={18} color="var(--accent-emerald)" />
                <span>{t('warrantyHeading')}</span>
              </div>
              <div className="form-grid-3">
                <div className="form-group">
                  <label className="form-label">{t('hasWarrantyLabel')}</label>
                  <select className="form-select" value={hasWarranty} onChange={e=>setHasWarranty(e.target.value)}>
                    <option value="yes">🛡️ {t('warrantyIn')}</option>
                    <option value="no">❌ {t('warrantyNone')}</option>
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">{t('warrantyYearsLabel')}</label>
                  <input 
                    type="number" 
                    min="0" 
                    step="0.5" 
                    className="form-input" 
                    placeholder="1, 2, 3..." 
                    value={warrantyYears} 
                    onChange={e=>setWarrantyYears(e.target.value)} 
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">{t('warrantyStartLabel')}</label>
                  <input 
                    type="date" 
                    className="form-input" 
                    value={warrantyStartDate} 
                    onChange={e=>setWarrantyStartDate(e.target.value)} 
                  />
                </div>
              </div>

              {/* Row 6: Description */}
              <div className="form-group" style={{marginTop:12}}>
                <label className="form-label">{t('formDescription')}</label>
                <textarea className="form-textarea" rows="3" placeholder={t('formDescription')} value={description} onChange={e=>setDescription(e.target.value)}></textarea>
              </div>

              {/* Row 7: ATTACHED DOCUMENTS */}
              <div className="section-title">
                <Icon name="paperclip" size={18} color="var(--primary)" />
                <span>{t('docTitle')}</span>
              </div>
              <div>
                <input type="file" multiple id="doc-upload" style={{display:'none'}} onChange={handleFileUpload} />
                <label htmlFor="doc-upload" className="btn btn-secondary" style={{cursor:'pointer', display:'inline-flex'}}>
                  <Icon name="paperclip" size={16} /> {t('docUploadBtn')}
                </label>

                {documents.length === 0 ? (
                  <p style={{fontSize:'0.85rem', color:'var(--text-muted)', marginTop:10, fontStyle:'italic'}}>{t('noDocsMsg')}</p>
                ) : (
                  <div className="document-list">
                    {documents.map(doc => (
                      <div key={doc.id} className="document-item">
                        <div className="document-info">
                          <Icon name="fileText" size={18} color="var(--primary)" />
                          <div>
                            <div style={{fontWeight:600}}>{doc.name}</div>
                            <div style={{fontSize:'0.75rem', color:'var(--text-muted)'}}>{doc.size} • {doc.date}</div>
                          </div>
                        </div>
                        <button type="button" className="btn-icon" style={{padding:4, color:'var(--accent-rose)', border:'none'}} onClick={() => handleRemoveDocument(doc.id)} title={t('deleteProject')}>
                          <Icon name="trash" size={14} color="var(--accent-rose)" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* SUBMIT BUTTONS */}
              <div style={{display:'flex', justifyContent:'flex-end', gap:10, marginTop:24}}>
                <button type="button" className="btn btn-secondary" onClick={handleSafeClose}>{t('btnCancel')}</button>
                <button type="submit" className="btn btn-primary"><Icon name="save" size={16} /> {t('btnSaveProject')}</button>
              </div>
